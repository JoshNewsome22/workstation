<!-- v26.00 (the BCBA, 11/13: "a place that goes over everything that a person who is studying to become a RBT can go and
     learn all the materials they need to know based on the BACB ... content and course sequence topics. Also, a person
     studying to be a BCBA ... a full fledge curriculum space where the information that is already in the workstation can
     be pulled into as well as additional information and trainings that I present as well as videos"; and, asked whether
     the RBT track should count as the 40-hour training: "Yes, with me as the Responsible Trainer.")
     The Learning page. Two tracks, from the map in nbh-learn.js:
       RBT training   the eight sections of the BACB's RBT 2026 40-hour curriculum outline, their minimum hours, and
                      the units under each. A written unit (nbh-learn-units.js) teaches on the page: a lesson in short
                      segments, each closed by a question; the workstation's videos; examples and non-examples to sort;
                      a session to run by decisions; a quiz; and the role-plays and discussion the trainer leads.
       BCBA study     the nine domains and 104 tasks of the BCBA test content outline, each with what the workstation
                      has for it and the learner's own rating.
     The time. The page counts time only while a part of a unit is open, the page is in view, and the learner is doing
     something (a touch, a key, a scroll within the last 90 seconds), or a video is playing. Each part of a unit counts
     up to a limit, so a page left open adds nothing. Further reading is not counted. The trainer's sessions (role-play
     with feedback, discussion, modeling) are logged by the trainer, on the trainer's device.
     Where it is kept. On the device, in this browser: the learner's record in localStorage nbh.learn.v1 (a name and a
     BACB ID if the learner types them, the seconds counted by day, section and kind, the answers' scores); the
     trainer's records in nbh.learn.trainer.v1 (the trainer's name and number, the trainees' names and BACB IDs, the
     sessions, the records the trainees sent). A learner sends the record to the trainer as a file. Nothing here is
     about a student, and nothing is sent anywhere by the page.
     The certificate. Made on the trainer's device, for one trainee, and only when the whole training is in place
     (NBH_LEARN.rbt.ready), every unit is passed, each section's hours and the 40 hours are met, and the dates span 5 to
     180 days. Until the training is whole the page says so and does not carry the BACB's statement. -->

<style>

<header class="ln-top"><div class="ln-wrap">
  <a class="ln-brand" href="#home">Learning</a>
  <nav class="ln-nav" aria-label="Learning"><a href="#rbt" data-nav="rbt">RBT training</a><a href="#bcba" data-nav="bcba">BCBA study</a><a href="#record" data-nav="record">My record</a><a href="#trainer" data-nav="trainer">For the trainer</a></nav>
  <span class="ln-clock" id="lnClock" role="status" aria-live="off" hidden><i aria-hidden="true"></i><span id="lnClockT"></span></span>
  <a class="ln-btn" id="lnToVideos" href="videos.html" hidden>Video library</a>
  <button type="button" class="ln-btn" id="lnClose" hidden>Close</button>
</div></header>
<main id="lnMain" tabindex="-1"><div class="ln-wrap" id="lnView"></div></main>
<div class="ln-sr" id="lnSay" role="status" aria-live="polite"></div>
<dialog class="ln-dlg" id="lnDlg" aria-labelledby="lnDlgT"><div class="ln-dlgbar"><strong id="lnDlgT"></strong><button type="button" class="ln-btn" id="lnDlgX">Back to the unit</button></div></dialog>
<input type="file" id="lnFile" accept="application/json,.json" hidden>
<script src="nbh-videos.js"></script>
<script src="nbh-learn.js"></script>
<script src="nbh-learn-units.js"></script>
<script>
(function(){'use strict';
const L=window.NBH_LEARN,U=window.NBH_LEARN_UNITS||{},VD=window.NBH_VIDEOS||{list:[],families:[]};
const $=id=>document.getElementById(id),view=$('lnView');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VBY={},FAM={},SEC={},UNIT={};
VD.list.forEach(v=>{VBY[v.key]=v;});VD.families.forEach(f=>{FAM[f[0]]=f[2]||f[1];});
L.rbt.sections.forEach(s=>{SEC[s.k]=s;s.units.forEach(u=>{u.sec=s.k;UNIT[u.id]=u;});});
let WS=false;try{WS=window.parent!==window&&!!window.parent.__wsVideos;}catch(e){WS=false;}
const tell=m=>{try{window.parent.postMessage(m,'*');}catch(e){}};
const say=t=>{const n=$('lnSay');n.textContent='';setTimeout(()=>{n.textContent=t;},30);};

/* ---- what is kept, on this device ---- */
const KEY='nbh.learn.v1',TKEY='nbh.learn.trainer.v1';
const read=(k,d)=>{try{const o=JSON.parse(localStorage.getItem(k)||'null');return o&&o.v===1?o:d;}catch(e){return d;}};
let S=read(KEY,{v:1,who:{name:'',bacb:''},tr:null,days:{},u:{},b:{}});
let T=read(TKEY,{v:1,me:{name:'',cred:'BCBA',cert:'',org:'',sig:''},chk:{},assist:[],trainees:[]});
S.who=S.who||{name:'',bacb:''};S.days=S.days||{};S.u=S.u||{};S.b=S.b||{};T.me=T.me||{};T.chk=T.chk||{};T.assist=T.assist||[];T.trainees=T.trainees||[];
let kept=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));kept=true;}catch(e){kept=false;}};
const saveT=()=>{try{localStorage.setItem(TKEY,JSON.stringify(T));kept=true;}catch(e){kept=false;}};
const pad=n=>(n<10?'0':'')+n;
const dayOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dayOf(new Date());
const niceDay=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');if(!m)return'';return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});};
const hm=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h+':'+pad(m);};
const hmWords=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h+(h===1?' hour':' hours')+' and '+m+(m===1?' minute':' minutes');};
const mins=m=>m>=60?(Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'')):m+' min';
const uState=id=>S.u[id]||(S.u[id]={les:[],t:{}});
const KINDS={lesson:'Lesson',video:'Videos',examples:'Examples',practice:'Practice',quiz:'Quiz'};
const LED={roleplay:'Role-play with feedback',discussion:'Discussion led by a trainer',modeling:'Modeling in person',other:'Other trainer-led activity'};

/* ---- the time: counted while a part is open, the page in view and the learner active, or a video playing ---- */
const IDLE=90000;
const clock={sec:null,unit:null,kind:null,playing:false,last:Date.now(),prev:Date.now(),n:0,full:false};
function capOf(u,kind){const c=U[u.id];
  if(kind==='video'){let d=0;(u.v||[]).forEach(k=>{d+=(VBY[k]&&VBY[k].dur)||0;});return Math.round(d*1.5)+(u.x?u.x.length*600:0)+(u.p?900:0);}
  if(!c)return 0;
  if(kind==='lesson')return c.lesson.length*240;
  if(kind==='examples')return c.examples.items.length*90;
  if(kind==='practice')return c.practice.steps.length*120;
  if(kind==='quiz')return c.quiz.draw*90*3;
  return 0;}
function setClock(unit,kind){if(clock.unit!==unit||clock.kind!==kind){clock.playing=false;}clock.unit=unit||null;clock.kind=unit?kind:null;clock.sec=unit?UNIT[unit].sec:null;clock.last=Date.now();clock.full=false;paintClock(false);}
function todaySec(){const d=S.days[today()]||{};let n=0;Object.keys(d).forEach(s=>Object.keys(d[s]).forEach(k=>{n+=d[s][k];}));return n;}
function paintClock(on){const c=$('lnClock');c.hidden=!clock.kind&&!todaySec();c.classList.toggle('on',!!on);
  $('lnClockT').textContent=(on?'Counting':clock.full?'This part is full':clock.kind?'Paused':'Today')+' · '+hm(todaySec())+' today';}
function tick(){const now=Date.now();let dt=(now-clock.prev)/1000;clock.prev=now;if(dt>5||dt<0)dt=0;   /* a sleeping tab adds nothing */
  const on=!!clock.kind&&document.visibilityState==='visible'&&(clock.kind==='video'?clock.playing:(now-clock.last<IDLE));
  if(!on||!dt){paintClock(false);return;}
  const us=uState(clock.unit),had=us.t[clock.kind]||0,cap=capOf(UNIT[clock.unit],clock.kind);
  if(had>=cap){clock.full=true;paintClock(false);return;}
  us.t[clock.kind]=had+dt;const d=S.days[today()]||(S.days[today()]={}),ds=d[clock.sec]||(d[clock.sec]={});ds[clock.kind]=(ds[clock.kind]||0)+dt;
  paintClock(true);if(++clock.n>=10){clock.n=0;save();}}
setInterval(tick,1000);
['pointerdown','keydown','scroll','input'].forEach(ev=>window.addEventListener(ev,()=>{clock.last=Date.now();},{passive:true,capture:true}));
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')save();});

/* seconds by section from a learner's days, and the trainer's sessions for a trainee */
function selfBySec(days){const o={};Object.keys(days||{}).forEach(d=>{const x=days[d]||{};Object.keys(x).forEach(s=>{if(!SEC[s])return;Object.keys(x[s]||{}).forEach(k=>{const n=+x[s][k];if(isFinite(n)&&n>0)o[s]=(o[s]||0)+n;});});});return o;}
function ledBySec(ses){const o={};(ses||[]).forEach(x=>{const u=UNIT[x.unit];if(!u)return;o[u.sec]=(o[u.sec]||0)+(+x.min||0)*60;});return o;}
function ledger(self,led,link){let tot=0;const segs=L.rbt.sections.map(s=>{const got=(self[s.k]||0)+((led||{})[s.k]||0),need=s.min*3600,pct=Math.min(100,got/need*100);tot+=got;
  const tag=link?'a href="#rbt" data-sec="'+s.k+'"':'div';
  return '<'+tag+' class="ln-seg'+(pct>=100?' full':'')+(pct>=45?' has':'')+'" style="flex-grow:'+s.min+'" title="'+esc(s.k+'. '+s.name+': '+hm(got)+' of '+s.min+' h')+'"><b style="width:'+pct.toFixed(1)+'%"></b><span>'+s.k+'</span></'+(link?'a':'div')+'>';}).join('');
  return '<div class="ln-ledger" role="img" aria-label="'+esc('Time counted by section: '+L.rbt.sections.map(s=>s.k+' '+hm((self[s.k]||0)+((led||{})[s.k]||0))+' of '+s.min+' hours').join(', '))+'">'+segs+'</div>'+
    '<div class="ln-ledcap"><span>Each block is a section of the outline, as wide as its minimum hours.</span><span><b>'+hm(tot)+'</b> of '+L.rbt.total+':00 hours</span></div>';}

/* ---- a unit's parts and how far each is ---- */
function watched(k){try{const v=JSON.parse(localStorage.getItem('nbh.videos.v1')||'null');return !!(v&&v.items&&v.items[k]&&v.items[k].w);}catch(e){return false;}}
function partsOf(u){const c=U[u.id],us=S.u[u.id]||{les:[],t:{}},out=[];
  if(c){const n=c.lesson.length,d=c.lesson.filter((x,i)=>us.les&&us.les[i]).length;out.push({k:'lesson',n:'Lesson',sub:d+' of '+n+' parts',st:d>=n?2:d?1:0});}
  if((u.v&&u.v.length)||u.x||u.p){const core=c?c.watch.filter(w=>w.c).map(w=>w.k):(u.v||[]),d=core.filter(watched).length;
    out.push({k:'watch',n:c?'Watch':'Watch now',sub:core.length?d+' of '+core.length+(c?' core videos':' videos'):'Explainers and practice',st:core.length&&d>=core.length?2:d?1:0});}
  if(c){const ex=us.ex;out.push({k:'examples',n:'Sort the examples',sub:ex?ex.right+' of '+ex.n+' right':c.examples.items.length+' scenes',st:ex?2:0});
    const pr=us.pr;out.push({k:'practice',n:'Run a session',sub:pr?pr.right+' of '+pr.n+' right':c.practice.steps.length+' decisions',st:pr?(pr.right/pr.n>=.8?2:1):0});
    const best=(us.quiz||[]).reduce((m,q)=>Math.max(m,q.pct),-1);out.push({k:'quiz',n:'Quiz',sub:best<0?'Pass at '+c.quiz.pass+'%':'Best: '+best+'%',st:best>=c.quiz.pass?2:best>=0?1:0});
    out.push({k:'trainer',n:'With your trainer',sub:'Role-play and discussion',st:0});}
  return out;}
function unitDone(u){const p=partsOf(u).filter(x=>x.k!=='trainer');return !!U[u.id]&&p.length>0&&p.every(x=>x.st===2);}
function unitPill(u){if(!U[u.id])return '<span class="ln-pill w">Lesson to come</span>';
  if(unitDone(u))return '<span class="ln-pill g">Your part is done</span>';
  const any=partsOf(u).some(x=>x.st>0);return '<span class="ln-pill n">'+(any?'Started':'Ready')+'</span>';}
function written(){let n=0,all=0;L.rbt.sections.forEach(s=>s.units.forEach(u=>{all++;if(U[u.id])n++;}));return [n,all];}
function stateBox(){const w=written();
  if(L.rbt.ready)return '<div class="ln-state ok"><p>'+esc(L.rbt.statementPages)+'</p></div>';
  return '<div class="ln-state" id="lnBuilding"><p><strong>This training is being built.</strong> '+w[0]+' of '+w[1]+' units are written. It is not yet a complete 40-hour training, and it cannot yet be used toward RBT certification. No certificate can be made until every unit is in place.</p></div>';}
function docs(list){return '<ul class="ln-list">'+list.map(d=>'<li><a href="'+esc(d[1])+'" target="_blank" rel="noopener">'+esc(d[0])+'</a> (bacb.com)</li>').join('')+'</ul>';}

/* ---- the pages ---- */
function vHome(){const w=written(),self=selfBySec(S.days),tr=S.tr;
  let nb=0,rated=0;L.bcba.domains.forEach(d=>d.tasks.forEach(t=>{nb++;if(S.b[t[0]]===2)rated++;}));
  view.innerHTML='<h1>Learning</h1><p class="ln-lead">Study for the RBT and BCBA examinations with the workstation’s own lessons, videos and practice, laid out as the BACB’s outlines lay the content out.</p>'+
   '<div class="ln-grid2">'+
    '<section class="ln-card ln-track" aria-labelledby="hRbt"><h2 id="hRbt">RBT training</h2><p>The eight sections of the 40-hour curriculum outline. Each unit teaches on the page, then you practice it with your trainer.</p>'+
      '<ul class="ln-facts"><li><b>'+L.rbt.sections.length+'</b> sections</li><li><b>'+w[1]+'</b> units</li><li><b>'+w[0]+'</b> written so far</li><li><b>43</b> tasks of the test outline</li></ul>'+
      ledger(self,null,false)+'<a class="ln-btn ln-pri" href="#rbt">Open the RBT training</a></section>'+
    '<section class="ln-card ln-track" aria-labelledby="hBcba"><h2 id="hBcba">BCBA study</h2><p>The nine domains and 104 tasks of the test content outline, each with what the workstation has for it. Rate yourself on each task and see where to study next.</p>'+
      '<ul class="ln-facts"><li><b>9</b> domains</li><li><b>'+nb+'</b> tasks</li><li><b>'+rated+'</b> you can explain</li></ul>'+
      '<a class="ln-btn ln-pri" href="#bcba">Open the BCBA study map</a></section>'+
   '</div>'+stateBox()+
   '<div class="ln-you">'+(tr&&tr.n?'<p style="margin:0"><strong>Your Responsible Trainer:</strong> '+esc(tr.n)+(tr.cr?', '+esc(tr.cr):'')+(tr.c?', certification number '+esc(tr.c):'')+(tr.o?' · '+esc(tr.o):'')+'</p>':'<p class="ln-note" style="margin:0">No trainer is named on this device yet. Your trainer gives you a link that names them.</p>')+'</div>'+
   '<p class="ln-foot">The time you spend is counted only while a part of a unit is open and you are working in it, or a video is playing. It is kept on this device. The people in every example and video are simulated.</p>';}

function vRbt(){const self=selfBySec(S.days);
  view.innerHTML='<h1>RBT training</h1><p class="ln-lead">Eight sections, as the BACB’s curriculum outline for the 40-hour training sets them out, with the minimum hours for each. The sections can be taken in any order.</p>'+
   stateBox()+'<div class="ln-card" style="margin-top:20px"><h2 class="ln-sr">Your time</h2>'+ledger(self,null,false)+'</div>'+
   L.rbt.sections.map(s=>{let plan=0;s.units.forEach(u=>{plan+=u.self+u.led;});
    return '<section class="ln-sec" id="sec'+s.k+'" aria-labelledby="sh'+s.k+'"><div class="ln-sechead"><span class="k" aria-hidden="true">'+s.k+'</span><h2 id="sh'+s.k+'"><span class="ln-sr">Section '+s.k+': </span>'+esc(s.name)+'</h2>'+
     '<span class="h">At least '+s.min+(s.min===1?' hour':' hours')+' · planned '+mins(plan)+' · yours '+hm(self[s.k]||0)+'</span></div><ul class="ln-units">'+
     s.units.map(u=>{const nv=(u.v||[]).length;
      return '<li class="ln-unit"><a class="t" href="#rbt/'+u.id+'">'+esc(u.t)+'</a><span class="s">'+unitPill(u)+'</span><span class="m">'+
       u.codes.map(c=>'<span class="ln-code" title="RBT Test Content Outline (3rd ed.), task '+c+'">'+c+'</span>').join('')+
       '<span>'+mins(u.self)+' on the page, '+mins(u.led)+' with your trainer</span>'+(nv?'<span>'+nv+(nv===1?' video':' videos')+'</span>':'')+'</span></li>';}).join('')+'</ul></section>';}).join('')+
   '<h2 style="margin-top:36px">The BACB’s documents</h2><p class="ln-note">The task codes on this page are those of the RBT Test Content Outline (3rd ed.). The titles are the workstation’s own short ones; the BACB’s wording is in its documents.</p>'+docs(L.rbt.docs);}

function matButtons(u){let h='';
  (u.x||[]).forEach(k=>{h+='<button type="button" class="ln-btn" data-open="explain.html#'+esc(k)+'" data-title="'+esc('Explainer: '+(L.explainers[k]||k))+'">Step through: '+esc(L.explainers[k]||k)+'</button>';});
  if(u.p)h+='<button type="button" class="ln-btn" data-open="practice.html" data-title="Practice counting">Practice counting</button>';
  (u.f||[]).forEach(f=>{h+=WS?'<button type="button" class="ln-btn" data-form="'+esc(f)+'">Form '+esc(f)+': '+esc(L.forms[f]||'')+'</button>':'<span class="ln-pill n" title="A form of the workstation, opened by your trainer">Form '+esc(f)+': '+esc(L.forms[f]||'')+'</span>';});
  return h?'<div class="ln-mat">'+h+'</div>':'';}
function vidRow(k,look,core){const v=VBY[k];if(!v)return'';const w=watched(k),d=Math.round(v.dur||0);
  return '<li class="ln-vid"><img src="'+esc(v.poster)+'" alt="" loading="lazy" width="168" height="95"><div><div class="tt">'+esc(v.title)+'</div>'+(look?'<div class="lk"><strong>Look for:</strong> '+esc(look)+'</div>':'')+
   '<div class="mt"><span>'+Math.floor(d/60)+':'+pad(d%60)+'</span>'+(core?'<span class="ln-pill n">Core</span>':'')+(w?'<span class="ln-pill g">Watched</span>':'')+'</div></div>'+
   '<div class="go"><button type="button" class="ln-btn'+(w?'':' ln-pri')+'" data-open="videos.html#video='+encodeURIComponent(k)+'" data-title="'+esc(v.title)+'" data-video="1">'+(w?'Watch again':'Watch')+'</button></div></li>';}

let cur={};   /* the page's passing state: the lesson part shown, an activity under way */
function vUnit(id,part){const u=UNIT[id];if(!u){location.hash='#rbt';return;}
  const c=U[id],s=SEC[u.sec],parts=partsOf(u);
  if(!part||!parts.some(p=>p.k===part))part=parts.length?(parts.find(p=>p.st<2&&p.k!=='trainer')||parts[0]).k:'';
  const head='<p class="ln-crumb"><a href="#rbt">RBT training</a> › Section '+s.k+': '+esc(s.name)+'</p><h1>'+esc(u.t)+'</h1>'+
   '<div class="ln-uhead">'+u.codes.map(x=>'<span class="ln-code" title="RBT Test Content Outline (3rd ed.), task '+x+'">'+x+'</span>').join('')+'<span class="ln-note">'+mins(u.self)+' on the page, '+mins(u.led)+' with your trainer</span>'+unitPill(u)+'</div>';
  if(!c){setClock(parts.length?id:null,'video');
    view.innerHTML=head+'<div class="ln-state"><p><strong>The lesson for this unit is still to be written.</strong> '+(parts.length?'What the workstation already has for it is below, and can be watched now.':'The workstation has no video for it yet.')+'</p></div>'+
     ((u.v||[]).length?'<h2 style="margin-top:24px">Videos</h2><ul class="ln-vids" style="margin-top:12px">'+u.v.map(k=>vidRow(k,'',false)).join('')+'</ul>':'')+matButtons(u);return;}
  const nav='<ol class="ln-parts" aria-label="The parts of this unit">'+parts.map(p=>'<li><a href="#rbt/'+id+'/'+p.k+'"'+(p.k===part?' aria-current="step"':'')+'><span class="d'+(p.st===2?' done':p.st===1?' part':'')+'" aria-hidden="true">'+(p.st===2?'✓':'')+'</span><span>'+esc(p.n)+'<small>'+esc(p.sub)+'</small><span class="ln-sr">'+(p.st===2?', done':p.st===1?', started':'')+'</span></span></a></li>').join('')+'</ol>';
  view.innerHTML=head+'<div class="ln-two">'+nav+'<div class="ln-body" id="lnBody"></div></div>';
  const body=$('lnBody');if(part==='trainer')setClock(null);else setClock(id,part==='watch'?'video':part);
  ({lesson:pLesson,watch:pWatch,examples:pExamples,practice:pPractice,quiz:pQuiz,trainer:pTrainer})[part](u,c,body);}

function optBtns(opts,name){return '<div class="ln-opts">'+opts.map((o,i)=>'<button type="button" class="ln-opt" data-pick="'+i+'">'+esc(o)+'</button>').join('')+'</div>';}
function pLesson(u,c,body){const us=uState(u.id);let i=cur.seg;if(cur.unit!==u.id||i==null||i>=c.lesson.length){i=c.lesson.findIndex((x,k)=>!us.les[k]);if(i<0)i=0;}cur={unit:u.id,seg:i};
  const g=c.lesson[i],done=!!us.les[i];
  body.innerHTML='<h2>Lesson</h2>'+(i===0?'<p class="ln-note" style="margin-bottom:4px">After this unit you can:</p><ul class="ln-list">'+c.aim.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>':'')+
   '<ol class="ln-steps" aria-label="Parts of the lesson">'+c.lesson.map((x,k)=>'<li><button type="button" data-seg="'+k+'" class="'+(us.les[k]?'done':'')+'"'+(k===i?' aria-current="true"':'')+' aria-label="Part '+(k+1)+': '+esc(x.h)+(us.les[k]?', done':'')+'">'+(k+1)+'</button></li>').join('')+'</ol>'+
   '<article class="ln-prose"><h3 style="font-size:1.375rem;margin-bottom:10px">'+esc(g.h)+'</h3>'+g.p.map(p=>'<p>'+esc(p)+'</p>').join('')+'</article>'+(g.key?'<ul class="ln-key">'+g.key.map(k=>'<li>'+esc(k)+'</li>').join('')+'</ul>':'')+
   '<div class="ln-q" id="lnCheck"><p class="q">Check: '+esc(g.check.q)+'</p>'+optBtns(g.check.opts)+'<div id="lnWhy" aria-live="polite"></div></div>'+
   '<div class="ln-row"><button type="button" class="ln-btn" data-seg="'+(i-1)+'"'+(i?'':' disabled')+'>Back</button><button type="button" class="ln-btn ln-pri" id="lnNext" '+(done?'':'disabled')+'>'+(i<c.lesson.length-1?'Next part':'On to the videos')+'</button></div>';
  if(done)showCheck(g.check,g.check.a,true);
  body.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.seg!=null&&!b.disabled){cur.seg=+b.dataset.seg;pLesson(u,c,body);focusBody();return;}
    if(b.dataset.pick!=null&&!b.disabled){const k=+b.dataset.pick,ok=k===g.check.a;showCheck(g.check,k,ok);
      if(ok&&!us.les[i]){us.les[i]=1;save();$('lnNext').disabled=false;paintParts(u);const sb=body.querySelector('.ln-steps [data-seg="'+i+'"]');if(sb){sb.classList.add('done');sb.setAttribute('aria-label',sb.getAttribute('aria-label')+', done');}}return;}
    if(b.id==='lnNext'){if(i<c.lesson.length-1){cur.seg=i+1;pLesson(u,c,body);focusBody();}else location.hash='#rbt/'+u.id+'/watch';}};}
function showCheck(ch,k,ok){const box=$('lnCheck');box.querySelectorAll('.ln-opt').forEach((b,j)=>{b.classList.remove('right','wrong');if(j===k)b.classList.add(ok?'right':'wrong');if(ok)b.disabled=true;});
  $('lnWhy').innerHTML='<p class="ln-why '+(ok?'right':'wrong')+'"><strong>'+(ok?'Right. ':'Not that one. ')+'</strong>'+(ok?esc(ch.why):'Read the part again and choose another answer.')+'</p>';}
function focusBody(){const b=$('lnBody');if(b){const h=b.querySelector('h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo(0,Math.max(0,b.getBoundingClientRect().top+window.scrollY-90));}}
function paintParts(u){const ol=view.querySelector('.ln-parts');if(!ol)return;
  partsOf(u).forEach((p,i)=>{const a=ol.children[i]&&ol.children[i].firstChild;if(!a)return;const d=a.querySelector('.d');d.className='d'+(p.st===2?' done':p.st===1?' part':'');d.textContent=p.st===2?'✓':'';a.querySelector('small').textContent=p.sub;});
  const pill=view.querySelector('.ln-uhead .ln-pill');if(pill)pill.outerHTML=unitPill(u);}

function pWatch(u,c,body){const core=c.watch.filter(w=>w.c),more=c.watch.filter(w=>!w.c);
  body.innerHTML='<h2>Watch</h2><p class="ln-note">Each video shows the procedure with simulated people. Watch the core ones; the rest show the same procedure in other situations. Time is counted while a video plays.</p>'+
   '<h3 style="margin:16px 0 10px">Core videos</h3><ul class="ln-vids">'+core.map(w=>vidRow(w.k,w.look,true)).join('')+'</ul>'+
   (more.length?'<h3 style="margin:22px 0 10px">More to watch</h3><ul class="ln-vids">'+more.map(w=>vidRow(w.k,w.look,false)).join('')+'</ul>':'')+

/* examples and practice: one scene at a time, an answer, the reason, the next */
function runSet(u,body,o){let i=0,right=0;const n=o.items.length;
  const draw=()=>{const it=o.items[i];
    body.innerHTML='<h2>'+esc(o.title)+'</h2>'+(o.top||'')+'<p class="ln-note" aria-live="polite">'+esc(o.word)+' '+(i+1)+' of '+n+'</p>'+
     '<div class="ln-q" id="lnCheck">'+(it.t?'<p class="ln-when">'+esc(it.t)+'</p>':'')+'<p class="ln-scene">'+esc(it.s)+'</p>'+(o.ask?'<p class="q">'+esc(o.ask)+'</p>':'')+optBtns(it.opts||o.opts)+'<div id="lnWhy" aria-live="polite"></div></div>'+
     '<div class="ln-row"><button type="button" class="ln-btn ln-pri" id="lnNext" disabled>'+(i<n-1?'Next':'See the result')+'</button></div>';};
  const end=()=>{const pct=Math.round(right/n*100);o.done(right,n);save();paintParts(u);
    body.innerHTML='<h2>'+esc(o.title)+'</h2><p class="ln-score" id="lnScore">'+right+' of '+n+'</p><p class="ln-prose">'+esc(o.verdict(pct))+'</p>'+
     '<div class="ln-row"><button type="button" class="ln-btn" id="lnAgain">Do it again</button><a class="ln-btn ln-pri" href="#rbt/'+u.id+'/'+o.next[0]+'">'+esc(o.next[1])+'</a></div>';say(right+' of '+n+' right');};
  body.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.pick!=null){const it=o.items[i],k=+b.dataset.pick,ok=k===it.a;if(ok)right++;
      body.querySelectorAll('.ln-opt').forEach((x,j)=>{x.disabled=true;if(j===it.a)x.classList.add('right');else if(j===k)x.classList.add('wrong');});
      $('lnWhy').innerHTML='<p class="ln-why '+(ok?'right':'wrong')+'"><strong>'+(ok?'Right. ':'Not quite. ')+'</strong>'+esc(it.why)+'</p>';$('lnNext').disabled=false;$('lnNext').focus();return;}
    if(b.id==='lnNext'){i++;if(i<n){draw();focusBody();}else end();return;}
    if(b.id==='lnAgain'){i=0;right=0;draw();focusBody();}};
  draw();}
function pExamples(u,c,body){const us=uState(u.id);
  runSet(u,body,{title:'Sort the examples',top:'<p class="ln-prose">'+esc(c.examples.intro)+'</p>',word:'Scene',ask:'Which procedure is this?',opts:c.examples.opts,
    items:c.examples.items,done:(r,n)=>{us.ex={right:r,n:n,at:today()};},verdict:p=>p>=80?'You can tell the procedures apart. Go on to run a session.':'Read the reasons again, then try once more: the non-examples are the ones that catch people.',next:['practice','Run a session']});}
function pPractice(u,c,body){const us=uState(u.id),P=c.practice;
  runSet(u,body,{title:P.title,top:'<p class="ln-prose">'+esc(P.intro)+'</p><div class="ln-plan"><strong>The plan</strong><ul>'+P.plan.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>',word:'Decision',ask:'What do you do?',
    items:P.steps.map(s=>({t:s.t,s:s.see,opts:s.opts,a:s.a,why:s.why})),done:(r,n)=>{if(!us.pr||r>=us.pr.right)us.pr={right:r,n:n,at:today()};},
    verdict:p=>p>=80?'You ran the plan as written. The quiz is next.':'Run it again. The plan answers every one of these decisions: read it before each choice.',next:['quiz','Take the quiz']});}

function shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pQuiz(u,c,body){const us=uState(u.id),Q=c.quiz,past=us.quiz||[];
  const start=()=>{const set=shuffle(Q.items.map((x,i)=>i),Math.random).slice(0,Q.draw);
    body.innerHTML='<h2>Quiz</h2><form id="lnQuiz" novalidate>'+set.map((qi,n)=>{const q=Q.items[qi];
      return '<fieldset class="ln-q" data-q="'+qi+'"><legend>'+(n+1)+'. '+esc(q.q)+'</legend><div class="ln-opts">'+q.opts.map((o,i)=>'<label class="ln-opt"><input type="radio" name="q'+qi+'" value="'+i+'"><span>'+esc(o)+'</span></label>').join('')+'</div><div class="w"></div></fieldset>';}).join('')+
     '<p class="ln-why wrong" id="lnQMiss" hidden></p><div class="ln-row"><button type="submit" class="ln-btn ln-pri">Hand in the quiz</button></div></form>';
    $('lnQuiz').onsubmit=e=>{e.preventDefault();const f=e.target,sets=[...f.querySelectorAll('fieldset')],blank=sets.filter(s=>!s.querySelector('input:checked'));
      if(blank.length){const m=$('lnQMiss');m.hidden=false;m.textContent=blank.length+(blank.length===1?' question has':' questions have')+' no answer yet.';blank[0].querySelector('input').focus();return;}
      let right=0;sets.forEach(s=>{const q=Q.items[+s.dataset.q],k=+s.querySelector('input:checked').value,ok=k===q.a;if(ok)right++;
        s.querySelectorAll('.ln-opt').forEach((l,j)=>{l.querySelector('input').disabled=true;if(j===q.a)l.classList.add('right');else if(j===k)l.classList.add('wrong');});
        s.querySelector('.w').innerHTML='<p class="ln-why '+(ok?'right':'wrong')+'"><strong>'+(ok?'Right. ':'Not quite. ')+'</strong>'+esc(q.why)+'</p>';});
      const pct=Math.round(right/sets.length*100),pass=pct>=Q.pass;(us.quiz=us.quiz||[]).push({at:today(),right:right,n:sets.length,pct:pct,pass:pass?1:0});save();paintParts(u);
      $('lnQMiss').hidden=true;const row=f.querySelector('.ln-row');
      row.innerHTML='<div><p class="ln-score" id="lnScore">'+pct+'%</p><p class="ln-prose">'+(pass?'Passed, with '+right+' of '+sets.length+'. Your part of this unit is '+(unitDone(u)?'done':'nearly done: see the list of parts')+'. The role-plays with your trainer come next.':'Not yet: '+right+' of '+sets.length+', and the pass mark is '+Q.pass+'%. Read the reasons above, then take it again with a new set of questions.')+'</p>'+
        '<div class="ln-row"><button type="button" class="ln-btn" id="lnAgain">Take it again</button>'+(pass?'<a class="ln-btn ln-pri" href="#rbt/'+u.id+'/trainer">With your trainer</a>':'')+'</div></div>';
      $('lnAgain').onclick=()=>{start();focusBody();};$('lnScore').tabIndex=-1;$('lnScore').focus();say(pct+' percent. '+(pass?'Passed.':'Not passed yet.'));};};
  if(past.length&&!cur.quizNow){const best=past.reduce((m,q)=>Math.max(m,q.pct),0);
    body.innerHTML='<h2>Quiz</h2><p class="ln-prose">'+Q.draw+' questions, drawn anew each time from a larger set. Pass at '+Q.pass+'%.</p>'+
     '<div class="ln-tablewrap"><table class="ln-t" style="max-width:420px"><thead><tr><th>Attempt</th><th>Date</th><th class="n">Score</th><th>Result</th></tr></thead><tbody>'+
     past.map((q,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(niceDay(q.at))+'</td><td class="n">'+q.right+' of '+q.n+' ('+q.pct+'%)</td><td>'+(q.pass?'Passed':'Not yet')+'</td></tr>').join('')+'</tbody></table></div>'+
     '<div class="ln-row"><button type="button" class="ln-btn'+(best>=Q.pass?'':' ln-pri')+'" id="lnAgain">Take it again</button>'+(best>=Q.pass?'<a class="ln-btn ln-pri" href="#rbt/'+u.id+'/trainer">With your trainer</a>':'')+'</div>';
    $('lnAgain').onclick=()=>{start();focusBody();};body.onclick=null;return;}
  body.onclick=null;start();}

function timeTable(days,ses){const self=selfBySec(days),led=ledBySec(ses);let ts=0,tl=0;
  return '<div class="ln-tablewrap"><table class="ln-t"><thead><tr><th>Section</th><th class="n">On the page</th>'+(ses?'<th class="n">With the trainer</th><th class="n">Total</th>':'')+'<th class="n">At least</th></tr></thead><tbody>'+
   L.rbt.sections.map(s=>{const a=self[s.k]||0,b=led[s.k]||0;ts+=a;tl+=b;return '<tr><td>'+s.k+'. '+esc(s.name)+'</td><td class="n">'+hm(a)+'</td>'+(ses?'<td class="n">'+hm(b)+'</td><td class="n">'+hm(a+b)+'</td>':'')+'<td class="n">'+s.min+':00</td></tr>';}).join('')+
   '</tbody><tfoot><tr><td>All sections</td><td class="n">'+hm(ts)+'</td>'+(ses?'<td class="n">'+hm(tl)+'</td><td class="n">'+hm(ts+tl)+'</td>':'')+'<td class="n">'+L.rbt.total+':00</td></tr></tfoot></table></div>';}
function quizRows(u){const out=[];Object.keys(u||{}).forEach(id=>{const un=UNIT[id];if(!un)return;const x=u[id]||{},q=x.quiz||[];if(!q.length&&!x.ex&&!x.pr)return;
  const best=q.reduce((m,a)=>Math.max(m,+a.pct||0),0);out.push('<tr><td>'+esc(un.t)+'</td><td class="n">'+(x.ex?(+x.ex.right||0)+' of '+(+x.ex.n||0):'')+'</td><td class="n">'+(x.pr?(+x.pr.right||0)+' of '+(+x.pr.n||0):'')+'</td><td class="n">'+q.length+'</td><td class="n">'+(q.length?best+'%':'')+'</td><td>'+(q.some(a=>a.pass)?'Passed':q.length?'Not yet':'')+'</td></tr>');});
  return out.length?'<div class="ln-tablewrap"><table class="ln-t"><thead><tr><th>Unit</th><th class="n">Examples</th><th class="n">Session</th><th class="n">Quiz attempts</th><th class="n">Best</th><th>Quiz</th></tr></thead><tbody>'+out.join('')+'</tbody></table></div>':'<p class="ln-note">No unit started yet.</p>';}
function exportRec(){return {kind:'nbh-learn-record',v:1,made:new Date().toISOString(),who:{name:S.who.name||'',bacb:S.who.bacb||''},tr:S.tr||null,days:S.days,u:S.u};}

const newId=()=>'t'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
function trainee(id){return T.trainees.find(x=>x.id===id);}
/* what the BACB's requirements ask of one trainee's record, and what this trainee has */
function req(t){const rec=t.rec||{days:{},u:{}},self=selfBySec(rec.days),led=ledBySec(t.ses);let tot=0;const short=[];
  L.rbt.sections.forEach(s=>{const got=(self[s.k]||0)+(led[s.k]||0);tot+=got;if(got<s.min*3600)short.push(s.k);});
  const ds=Object.keys(rec.days||{}).concat((t.ses||[]).map(x=>x.d)).filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)).sort();
  /* the first and the last day are days with a record: time the trainee's device counted, or a session the trainer logged. The day the trainer typed for a new trainee only stands in until there is one */
  const start=ds[0]||(t.start&&/^\d{4}-\d\d-\d\d$/.test(t.start)?t.start:''),end=ds.length?ds[ds.length-1]:'';
  const span=start&&end?Math.round((Date.parse(end+'T12:00:00')-Date.parse(start+'T12:00:00'))/864e5)+1:0;
  const need=[];let units=0,done=0;
  L.rbt.sections.forEach(s=>s.units.forEach(u=>{units++;const c=U[u.id];if(!c){need.push(u.id);return;}
    const x=(rec.u||{})[u.id]||{},quiz=(x.quiz||[]).some(q=>q.pass),roles=c.role.every((r,i)=>(t.ses||[]).some(z=>z.unit===u.id&&z.kind==='roleplay'&&z.role===i&&z.met)),disc=(t.ses||[]).some(z=>z.unit===u.id&&z.kind==='discussion');
    if(quiz&&roles&&disc)done++;else need.push(u.id);}));

    if(!c){box.innerHTML='<p class="ln-note" style="margin-top:12px">This unit’s role-play steps are not written yet. The time can be logged; the role-play cannot be marked as met.</p>';return;}
    const i=Math.min(+(box.dataset.i||0),c.role.length-1);
    box.innerHTML='<div class="ln-form"><label class="ln-f">Role-play<select id="lgR">'+c.role.map((r,k)=>'<option value="'+k+'"'+(k===i?' selected':'')+'>'+esc(r.t)+'</option>').join('')+'</select></label></div><p class="ln-note" style="margin-top:8px">'+esc(c.role[i].setup)+' Tick each step done correctly, without help.</p>'+
     '<ul class="ln-checks" id="lgSteps">'+c.role[i].steps.map((s,k)=>'<li><label><input type="checkbox" data-step="'+k+'"><span>'+esc(s)+'</span></label></li>').join('')+'</ul>';
    $('lgR').onchange=e=>{box.dataset.i=e.target.value;role();};};
  $('lgK').onchange=role;$('lgU').onchange=()=>{$('lgRole').dataset.i=0;role();};role();
  $('lgForm').onsubmit=e=>{e.preventDefault();const d=$('lgD').value,m=Math.round(+$('lgM').value),miss=$('lgMiss');
    if(!/^\d{4}-\d\d-\d\d$/.test(d)||d>today()){miss.hidden=false;miss.textContent='Choose the date of the session, today or earlier.';$('lgD').focus();return;}
    if(!(m>=1&&m<=600)){miss.hidden=false;miss.textContent='Type the minutes, from 1 to 600.';$('lgM').focus();return;}
    const x={d:d,kind:$('lgK').value,unit:$('lgU').value,min:m,by:$('lgBy').value,role:null,steps:null,met:0,note:$('lgN').value.slice(0,400)};
    const st=$('lgSteps');if(x.kind==='roleplay'&&st){x.role=+$('lgR').value;x.steps=[...st.querySelectorAll('input')].map(i=>i.checked?1:0);x.met=x.steps.every(Boolean)?1:0;}
    (t.ses=t.ses||[]).push(x);t.ses.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);saveT();cur.logUnit=x.unit;location.hash='#trainer/'+t.id;};}

function vCert(t){const r=req(t),me=T.me;
  const head='<p class="ln-crumb ln-noprint"><a href="#trainer">For the trainer</a> › <a href="#trainer/'+t.id+'">'+esc(t.name)+'</a> › Certificate</p>';
  if(!r.ok){const why=[];if(!L.rbt.ready)why.push('The training is not whole yet: '+written()[0]+' of '+written()[1]+' units are written. Until every unit is in place this page makes no certificate for anyone.');
    if(!r.okHours)why.push('The hours: '+hm(r.tot)+' of 40:00'+(r.short.length?', and short in section'+(r.short.length>1?'s ':' ')+r.short.join(', '):'')+'.');
    if(!r.okDays)why.push('The days: '+(r.span||0)+' from the first day to the last; the training takes no fewer than 5 and no more than 180.');
    if(!r.okUnits)why.push('The units: '+r.done+' of '+r.units+' have the quiz passed, every role-play met and the discussion held.');
    if(!r.okWho)why.push('The trainee’s name and BACB ID are needed.');if(!r.okMe)why.push('Your name and certification number, and the self-check, are needed.');
    view.innerHTML=head+'<h1>Certificate</h1><div class="ln-state" id="certNo"><p><strong>No certificate can be made for '+esc(t.name)+' yet.</strong></p><ul class="ln-list" style="margin-bottom:0">'+why.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></div><div class="ln-row"><a class="ln-btn" href="#trainer/'+t.id+'">Back to the trainee</a></div>';return;}
  view.innerHTML=head+'<h1 class="ln-noprint">Certificate</h1><p class="ln-note ln-noprint">Read it against your records before you sign. Sign on the screen below, or print it and sign by hand.</p>'+
   '<div class="ln-cert" id="certSheet"><h2>RBT 2026 40-Hour Training Certificate</h2><p class="sub">'+esc(me.org||'')+'</p><dl>'+
    '<dt>Name of RBT applicant</dt><dd>'+esc(t.name)+'</dd><dt>RBT applicant BACB ID</dt><dd>'+esc(t.bacb)+'</dd>'+
    '<dt>Training start date</dt><dd>'+esc(niceDay(r.start))+'</dd><dt>Training end date</dt><dd>'+esc(niceDay(r.end))+'</dd>'+
    '<dt>Time engaged in the training</dt><dd>'+esc(hmWords(r.tot))+'</dd>'+
    '<dt>Responsible Trainer</dt><dd>'+esc(me.name)+', '+esc(me.cred||'')+'</dd><dt>Responsible Trainer certification number</dt><dd>'+esc(me.cert)+'</dd>'+
    '<dt>Assistant trainers</dt><dd>'+(T.assist.length?T.assist.map(a=>esc(a.name)+', '+esc(a.cert)).join('; '):'None')+'</dd></dl>'+
    '<p style="margin:0 0 4px;color:var(--muted);font-size:.9375rem">Responsible Trainer’s signature</p><div class="sig">'+(me.sig?'<img src="'+esc(me.sig)+'" alt="Signature of '+esc(me.name)+'">':'')+'</div>'+
    '<p class="stmt">'+esc(L.rbt.statement)+'</p></div>'+
   '<div class="ln-noprint"><h2 style="margin-top:20px">Sign</h2><canvas class="ln-pad" id="sigPad" width="840" height="240" aria-label="Sign here with a finger, a pencil or the mouse"></canvas><div class="ln-row"><button type="button" class="ln-btn" id="sigUse">Use this signature</button><button type="button" class="ln-btn" id="sigClr">Clear</button><button type="button" class="ln-btn ln-pri" id="certPrint">Print or save as PDF</button></div></div>';
  const cv=$('sigPad'),g=cv.getContext('2d');let down=false,drew=false;g.lineWidth=3.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#10202c';
  const pt=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height];};
  cv.onpointerdown=e=>{down=true;drew=true;cv.setPointerCapture(e.pointerId);const p=pt(e);g.beginPath();g.moveTo(p[0],p[1]);};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);g.lineTo(p[0],p[1]);g.stroke();};cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('sigClr').onclick=()=>{g.clearRect(0,0,cv.width,cv.height);drew=false;me.sig='';saveT();vCert(t);};
  $('sigUse').onclick=()=>{if(!drew)return;me.sig=cv.toDataURL('image/png');saveT();vCert(t);};$('certPrint').onclick=()=>window.print();}

/* ---- the player: a video, an explainer or the counting practice, over the unit ---- */
const dlg=$('lnDlg');let frame=null,back=null;
function openIn(url,title,isVideo,from){back=from||document.activeElement;$('lnDlgT').textContent=title||'';
  if(frame)frame.remove();frame=document.createElement('iframe');frame.title=title||'Video';frame.setAttribute('allow','fullscreen; autoplay');frame.setAttribute('allowfullscreen','');frame.src=url;dlg.appendChild(frame);
  clock.playing=!isVideo&&clock.kind==='video';clock.inFrame=!isVideo;   /* an explainer or the practice counts while it is open and used */
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
function closeIn(){clock.playing=false;clock.inFrame=false;if(frame){frame.remove();frame=null;}if(dlg.open){if(dlg.close)dlg.close();else dlg.removeAttribute('open');}route(true);if(back&&back.isConnected)try{back.focus();}catch(e){}}
$('lnDlgX').onclick=closeIn;dlg.addEventListener('cancel',e=>{e.preventDefault();closeIn();});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d.nbh!=='string'||!frame||e.source!==frame.contentWindow)return;
  if(d.nbh==='videos-playing')clock.playing=!!d.on;});
/* an explainer or the practice in the frame: its touches are not seen here, so the open frame counts for 90 seconds at a time while the page has the focus inside it */
setInterval(()=>{if(frame&&clock.inFrame&&document.visibilityState==='visible'&&document.activeElement===frame)clock.playing=true;else if(frame&&clock.inFrame)clock.playing=false;},1000);
view.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){openIn(o.dataset.open,o.dataset.title,!!o.dataset.video,o);return;}
  const f=e.target.closest('[data-form]');if(f&&WS)tell({nbh:'learn-form',form:f.dataset.form});});

/* ---- the address ---- */
function invite(h){try{const b=h.slice(2).replace(/-/g,'+').replace(/_/g,'/'),o=JSON.parse(decodeURIComponent(escape(atob(b))));
  if(o&&typeof o.n==='string'&&o.n.trim()){S.tr={n:o.n.slice(0,80),c:str(o.c,20),cr:/^(BCBA|BCBA-D|BCaBA)$/.test(o.cr||'')?o.cr:'',o:str(o.o,80)};save();}}catch(e){}
  try{history.replaceState(null,'','#home');}catch(e){location.hash='#home';}}
function route(keep){let h=location.hash.replace(/^#/,'');if(/^t=/.test(h)){invite(h);h='home';}
  const a=h.split('/'),top=a[0]||'home';if(!keep)cur={quizNow:false,logUnit:cur.logUnit};
  document.querySelectorAll('.ln-nav a').forEach(x=>{if(x.dataset.nav===top)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});
  if(top==='rbt'&&a[1])vUnit(a[1],a[2]);else if(top==='rbt'){setClock(null);vRbt();}
  else if(top==='bcba')vBcba(a[1]);else if(top==='record')vRecord();
  else if(top==='trainer'&&a[1])vTrainee(a[1],a[2]);else if(top==='trainer')vTrainer();
  else{setClock(null);vHome();}
  const names={home:'Learning',rbt:'RBT training',bcba:'BCBA study',record:'My record',trainer:'For the trainer'};
  document.title=((view.querySelector('h1')||{}).textContent||names[top]||'Learning')+' · Learning · FBA and BIP Workstation';
  if(!keep){window.scrollTo(0,0);const m=$('lnMain');try{m.focus({preventScroll:true});}catch(e){}}}
window.addEventListener('hashchange',()=>route(false));
$('lnClose').hidden=!WS;$('lnToVideos').hidden=!WS;$('lnClose').onclick=()=>{save();tell({nbh:'videos-close'});};
window.addEventListener('message',e=>{const d=e.data;if(!d||e.source!==window.parent||window.parent===window)return;if(d.nbh==='videos-focus'){try{$('lnMain').focus({preventScroll:true});}catch(x){}}});
window.NBHLearn={store:()=>JSON.parse(JSON.stringify(S)),trainer:()=>JSON.parse(JSON.stringify(T)),req:id=>{const t=trainee(id);return t?req(t):null;},clock:()=>({unit:clock.unit,kind:clock.kind,playing:clock.playing}),framed:()=>WS};
route(false);
})();
</script>
