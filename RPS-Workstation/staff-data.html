<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#182e43">
<title>Behavior Data</title>
<style>
:root{--navy:#182e43;--slate:#254657;--teal:#76a2a3;--mist:#eaf2f0;--ink:#1a2933;--muted:#54676f;--rule:#cfdad8;--red:#8e2a2a;--ok:#1f6b4a;--warn:#7a4b00}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#f1f4f3;color:var(--ink);font:16px/1.45 "Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.sd{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(24,46,67,.06)}
h1{font:600 21px/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--navy);margin:0 0 2px}
h2{font-size:17px;line-height:1.3;margin:0;color:var(--navy);overflow-wrap:anywhere}
.who{color:var(--muted);margin:0}
.who b{color:var(--ink)}
.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.f:first-child{margin-top:0}
input[type=date],input[type=text],select{width:100%;min-height:48px;padding:8px 12px;border:1px solid #b7c8c5;border-radius:10px;background:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1 1 0;min-width:0;min-height:48px;border:1.5px solid #b7c8c5;border-radius:10px;background:#fff;padding:6px 4px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button.as-refused[aria-pressed=true],.seg button.as-withdrew[aria-pressed=true]{background:#7c2222;border-color:#7c2222}
.th{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:0 0 10px}
.watch{flex:0 0 auto;min-height:44px;min-width:44px;border:1px solid #b7c8c5;border-radius:10px;background:#fff;padding:6px 10px;font-size:14px;font-weight:600;color:var(--slate)}
.watch[aria-pressed=false]{background:#f6eeee;border-color:#d9a5a5;color:#7c2222}
.t.off .ctl,.t.off .sub{opacity:.4}
.ctl{display:flex;align-items:center;gap:10px}
.big{flex:1 1 auto;min-height:72px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:26px;font-weight:700;padding:8px 12px}
.big:active{transform:scale(.98)}
.big.minus{background:var(--slate)}
.big.run{background:#7c2222}
.num{flex:0 0 auto;min-width:72px;text-align:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.undo{flex:0 0 auto;min-height:72px;min-width:64px;border:1.5px solid #b7c8c5;border-radius:14px;background:#fff;font-weight:600;padding:6px 10px}
.undo:disabled{opacity:.4}
.pm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.pm .tally{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
.eps{margin:8px 0 0;padding:0 0 0 20px;font-size:15px;font-variant-numeric:tabular-nums}
.note-in{margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(241,244,243,.97);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:560px;margin:0 auto}
.send{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:19px;font-weight:700;padding:8px 12px}
.send:disabled{opacity:.6}
.msg{min-height:1.4em;margin:0 0 8px;font-size:15px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}.msg.bad{color:var(--red)}
.old{background:#fdf6e7;border:1px solid #e3c98a;border-left:4px solid #9a6208;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.sent{margin:0;padding:0;list-style:none;font-size:15px}
.sent li{border-top:1px solid var(--rule);padding:8px 0}
.sent li:first-child{border-top:0}
.sent b{font-variant-numeric:tabular-nums}
.foot{font-size:13.5px;color:var(--muted);margin:4px 2px 0}
.empty{max-width:560px;margin:40px auto;padding:20px;background:#fff;border:1px solid var(--rule);border-radius:12px}
</style>
<script src="nbh-respond.js"></script>
</head>
<body>
<main class="sd" id="sd"></main>
<script src="staff-data-page.js"></script>
</body>
</html>
