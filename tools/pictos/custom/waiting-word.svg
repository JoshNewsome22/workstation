<?xml version="1.0" encoding="UTF-8"?>
<!-- A word card: "Waiting" in the user's card lettering (Georgia, navy #1b4b78 with a thin dark outline, letter-spacing
     .03em), one card from the user's Waiting card sheet (Waiting.svg), which has the word and no picture. Form TK-1
     prints a word card as its label alone, as on the sheet; other forms show this drawing of the word. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><text x="36" y="42.5" text-anchor="middle" font-family="Georgia,'Georgia Pro','Times New Roman',serif" font-size="18.5" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#1b4b78" stroke="#221f1f" stroke-width=".25">Waiting</text></svg>
