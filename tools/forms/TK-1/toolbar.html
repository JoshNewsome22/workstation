<!-- the shared pictogram library, one file beside the forms (see tools/pictos); the one-file edition inlines it -->
<script src="nbh-pictos.js"></script>
<div class="toolbar noprint">
  <!-- the whole state as JSON, so the shell's autosave and snapshots carry the pictures too; never shown -->
  <textarea id="tkState" name="tk.state" aria-hidden="true" tabindex="-1" hidden></textarea>
  <div class="tgroup"><span>View</span><div class="row">
    <div class="seg" id="viewSeg">
      <button data-view="setup" aria-pressed="true">Setup</button>
      <button data-view="choices" aria-pressed="false">Choices</button>
      <button data-view="targets" aria-pressed="false">Targets</button>
      <button data-view="board" aria-pressed="false">Board</button>
      <button data-view="backs" aria-pressed="false">Backs</button>
      <button data-view="preview" aria-pressed="false">Preview</button>
      <button data-view="guide" aria-pressed="false">Guide</button>
      <button data-view="walk" aria-pressed="false">Walkthrough</button>
    </div></div></div>
  <div class="tgroup"><span>Sheet actions</span><div class="row">
    <button id="simBtn">Load simulator</button>
    <button class="primary" id="printBtn">Print / Save as PDF</button>
    <button id="saveBtn">Save data</button>
    <button id="loadBtn">Open data</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <input type="file" id="photoIn" accept="image/*" hidden>
    <button id="csvBtn">Export CSV</button>
    <button id="clearBtn">Clear all</button>
  </div></div>
</div>
