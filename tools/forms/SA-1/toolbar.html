<div class="toolbar noprint">
  <div class="tgroup"><span>View</span><div class="row">
    <div class="seg" id="viewSeg">
      <button data-view="setup" aria-pressed="true">Setup</button>
      <button data-view="trials" aria-pressed="false">Trials</button>
      <button data-view="steps" aria-pressed="false">Steps</button>
      <button data-view="graph" aria-pressed="false">Graph</button>
      <button data-view="probes" aria-pressed="false">Probes</button>
      <button data-view="guide" aria-pressed="false">Guide</button>
    </div></div></div>
  <div class="tgroup"><span>Blank sheets</span><div class="row">
    <button id="trialSheetBtn">Print the trial sheet</button>
    <button id="taSheetBtn">Print the task-analysis sheet</button>
  </div></div>
  <div class="tgroup"><span>Sheet actions</span><div class="row">
    <button id="simBtn">Load simulation</button>
    <button class="primary" id="printBtn">Print / Save as PDF</button>
    <button id="saveBtn">Save data</button>
    <button id="loadBtn">Open data</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <button id="csvBtn">Export CSV</button>
    <button id="clearBtn">Clear all</button>
  </div></div>
</div>
