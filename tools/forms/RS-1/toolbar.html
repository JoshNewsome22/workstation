<div class="toolbar noprint">
  <div class="tgroup"><span>View</span><div class="row">
    <div class="seg" id="viewSeg">
      <button data-view="setup" aria-pressed="false">Setup</button>
      <button data-view="month" aria-pressed="true">Month</button>
      <button data-view="year" aria-pressed="false">Year</button>
      <button data-view="rbt" aria-pressed="false">RBT record</button>
      <button data-view="print" aria-pressed="false">Sign and print</button>
      <button data-view="guide" aria-pressed="false">Guide</button>
    </div></div></div>
  <div class="tgroup"><span>Records</span><div class="row">
    <button class="primary" id="printBtn" title="Prints the monthly supervision record of the month on screen">Print this month</button>
    <button id="yearPrintBtn" title="Prints the year summary">Print the year</button>
  </div></div>
  <div class="tgroup"><span>Sheet actions</span><div class="row">
    <button id="simBtn">Load simulation</button>
    <button id="saveBtn">Save data</button>
    <button id="loadBtn">Open data</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <button id="csvBtn">Export CSV</button>
    <button id="clearBtn">Clear all</button>
  </div></div>
</div>
