<!-- v21.62 My pictures: the practice's own pictures, taken with the camera (tools/blocks/nbh-pictures.js, one copy beside the forms; the one-file edition inlines it); without it the picker has no My pictures -->
<script src="nbh-pictures.js"></script>
<div class="toolbar noprint">
  <!-- the whole state as JSON, so the shell's autosave and snapshots carry the script and its pictures; never shown -->
  <textarea id="tvState" name="tv.state" aria-hidden="true" tabindex="-1" hidden></textarea>
  <div class="tgroup tv-views"><span>View</span><div class="row">
    <div class="seg" id="viewSeg">
      <button data-view="setup" aria-pressed="true">Setup</button>
      <button data-view="script" aria-pressed="false">Script</button>
      <button data-view="prompter" aria-pressed="false">Teleprompter</button>
      <button data-view="graphics" aria-pressed="false">Graphics</button>
      <button data-view="guide" aria-pressed="false">Guide</button>
    </div></div></div>
  <div class="tgroup tg-keep tv-undo"><span>Edit</span><div class="row">
    <button id="undoBtn" disabled title="Undo the last change (Ctrl/Cmd+Z)">Undo</button>
    <button id="redoBtn" disabled title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
  </div></div>
  <div class="tgroup"><span>Sheet actions</span><div class="row">
    <button id="simBtn">Load simulator</button>
    <button class="primary" id="draftBtn">Draft from the case</button>
    <button id="fastBtn" title="A ready script: the FAST walkthrough as Form IA-1 narrates it (Iwata, DeLeon &amp; Roscoe, 2013), to record a presenter version">Script: the FAST</button>
    <button id="printBtn">Print the script</button>
    <button id="saveBtn">Save data</button>
    <button id="loadBtn">Open data</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <button id="impBtn">Import a sheet</button>
    <input type="file" id="impIn" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <button id="xlsxBtn">Export for Sheets (.xlsx)</button>
    <button id="csvBtn">Export CSV</button>
    <input type="file" id="photoIn" accept="image/*" hidden>
    <button id="clearBtn">Clear all</button>
  </div></div>
</div>
