  /* 8. RR-1's school calendar: one line while it holds dates, the ledger first */
  var nsOpen = null, nsUser = false;

  /* 9. IC-1: read with the parent. Larger type, one column, and the staff's parts (how consent was obtained, the

  /* 10. v24.95 a row of fields lines up: every label on one line across the row, every box under it at the same height,
     the examples under the boxes (a grid each field shares). Only where every field is a label, its box and notes. */
  function isBox(c){ return (c.tagName === 'INPUT' && !/^(checkbox|radio|hidden)$/.test(c.type)) || c.tagName === 'SELECT' || c.tagName === 'TEXTAREA'; }
  function align(){
    $$('.fx2-sh .ident').forEach(function(g){
      var ok = !!g.children.length && Array.prototype.every.call(g.children, function(f){

    $$('.fx2-sh .fx2-fg').forEach(function(g){
      var ok = !!g.querySelector(':scope > .fx2-f') && Array.prototype.every.call(g.children, function(f){
        if (!f.classList.contains('fx2-f')) { var cs = getComputedStyle(f); return f.hidden || cs.display === 'none' || cs.gridColumnStart === '1' && cs.gridColumnEnd === '-1'; }

  /* 11. v24.95 an entry longer than its box: the box takes two columns, or the whole row, so it reads in full */
  var cv = null;
  function textW(f){ var t = f.tagName === 'SELECT' ? (f.selectedIndex >= 0 && f.value ? f.options[f.selectedIndex].textContent : '') : String(f.value || ''); if (!t.trim()) return 0;
    cv = cv || D.createElement('canvas'); var x = cv.getContext('2d'), cs = getComputedStyle(f); x.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    return x.measureText(t).width + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + (f.tagName === 'SELECT' ? 30 : 6) + 2; }
  function cols(g){ var t = getComputedStyle(g).gridTemplateColumns.split(' ').filter(function(x){ return /px$/.test(x); }); return { n: t.length, w: parseFloat(t[0]) || 0, gap: parseFloat(getComputedStyle(g).columnGap) || 0 }; }
  /* v25.67 fx2: a box out of sight (in a part Focus folds) keeps what it was given: measured as nothing, it lost its
     width and kept the loss once Focus was off (EA-1) */
  function long(){
    $$('.fx2-sh .ident.fx2-al, .fx2-sh .fx2-fg.fx2-al').forEach(function(g){ var c = cols(g); if (c.n < 2 || !c.w) return;
      Array.prototype.forEach.call(g.children, function(f){ if (g.classList.contains('fx2-fg') && !f.classList.contains('fx2-f')) return; var x = Array.prototype.filter.call(f.children, isBox)[0];
        if (x && x.type !== 'date' && x.type !== 'number' && !x.offsetParent) return;
        var w = x && x.type !== 'date' && x.type !== 'number' ? textW(x) : 0, k = 1;
        while (k < c.n && w > k * c.w + (k - 1) * c.gap) k++;
        tog(f, 'fx2-w2', k === 2 && c.n > 2); tog(f, 'fx2-wall', k > 1 && (k >= c.n)); }); });
    $$('.fx2-sh table.fx2-cards > tbody > tr').forEach(function(r){ var c = cols(r); if (c.n < 2 || !c.w) return;
      Array.prototype.forEach.call(r.cells, function(td){ if (td.getAttribute('data-fx2k') !== 'f') return; var x = td.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=date]):not([type=number]),select:not(.nbh-seg-src)');
        tog(td, 'fx2-wall', !!(x && x.offsetParent && textW(x) > c.w)); }); });
  }

  /* 12. v24.95 the form's toolbar on one row on an iPad held sideways: while it wraps, it gives up, a step at a time, the
     small labels ("The case"), the words beside the next-sheet arrow and Dictate's icon, then shortens the case and the
     sheet's name (each whole in its tooltip). It stops at the first step that fits; a toolbar no step brings to one row

  var tbKey = '';
  function tbFit(){
    if (!C.toolbar) return;
    var t = D.querySelector('div.toolbar'); if (!t || printing || !t.offsetParent || R.classList.contains('nbh-fold')) return;
    var cb = D.getElementById('nbhCaseBtn'), nx = t.querySelector('.nbh-next'), sm = nx && nx.querySelector('small'), dc = D.getElementById('nbhDictBtn');
    if (cb && cb.textContent.trim()) attr(cb, 'title', cb.textContent.trim());

    var key = t.clientWidth + '|' + t.textContent.length + '|' + $$(':scope > *', t).map(function(x){ return x.offsetParent ? 1 : 0; }).join('');
    if (key === tbKey) return;
    var set = function(n){ for (var i = 1; i <= 5; i++) tog(t, 'fx2-tb' + i, i <= n); };
    var best = 0;
    for (var n = 0; n <= 5; n++) { set(n); if (oneRow(t)) { best = n; break; } }
    set(best); tbKey = key;
  }
  function oneRow(t){ var g = $$(':scope > *', t).filter(function(x){ return x.offsetParent && x.getBoundingClientRect().height; }); if (!g.length) return true;
    var top = g.map(function(x){ return x.getBoundingClientRect().top; }), hi = g.map(function(x){ return x.getBoundingClientRect().height; });
    return Math.max.apply(null, top) - Math.min.apply(null, top) < 8 && Math.max.apply(null, hi) < 60; }

  /* the form's pages: a .sheet, or a section shown one at a time (IN-1's section.only-setup) */
  function mark(){ $$('.sheet, section[class*="only-"]' + (C.sheets ? ', ' + C.sheets : '')).forEach(function(x){ if (!x.classList.contains('fx2-sh')) x.classList.add('fx2-sh'); }); }
  /* v25.69 fx2: the paper copies a form draws on screen (FX2_CFG.paper) keep the type they print with. The reading-type
     rules of the style above that end :where(:not(.fx2-pp)) go off (the class on the page) and come back in a style of
     their own, right after the shared style, each selector ending :where(:not(:is(PAPER) *)): pure CSS, so a copy the form
     draws and measures at once (TK-1's book pages, fitted as they are drawn) never takes the reading type */
  function paperCSS(){ if (!C.paper || D.getElementById('fx2-paper-css')) return; var st = D.getElementById('fx2-v2492'), out;
    function gen(list){ var o = []; Array.prototype.forEach.call(list, function(r){
      if (r.cssRules && !r.selectorText) { var inner = gen(r.cssRules); if (inner.length && (r.media || r.conditionText)) o.push((r.media ? '@media ' + r.media.mediaText : '@supports ' + r.conditionText) + '{' + inner.join('\n') + '}'); return; }
      var t = r.selectorText || ''; if (t.indexOf(':where(:not(.fx2-pp))') < 0) return;
      var parts = [], d = 0, a = 0; for (var i = 0; i < t.length; i++) { var c = t.charAt(i); if (c === '(') d++; else if (c === ')') d--; else if (c === ',' && !d) { parts.push(t.slice(a, i)); a = i + 1; } } parts.push(t.slice(a));
      o.push(parts.map(function(x){ return x.trim().split(':where(:not(.fx2-pp))').join(':where(.fx2-pp)') + ':where(:not(:is(' + C.paper + ') *))'; }).join(',') + '{' + r.style.cssText + '}'); }); return o; }
    try { out = gen(st.sheet.cssRules); } catch (e) { return; }
    if (!out.length) return; var el = D.createElement('style'); el.id = 'fx2-paper-css'; el.setAttribute('data-nbh-screen', ''); el.textContent = out.join('\n');
    st.after(el); R.classList.add('fx2-pp'); }
  function run(){ if (printing) return; try { wrapPlain(); mark(); intro(); heads(); fields(); hints(); rows(); segs(); cards(); contacts(); packet(); nsFold(); parentView(); align(); egAll(); long(); tbFit(); } catch (e) { if (window.console) console.warn('fx2', e); } }
  var timer = 0; function soon(){ clearTimeout(timer); timer = setTimeout(run, 120); }
  /* TB-1's chips jump to a target's card; a sheet just shown still grows its boxes to their text, so the jump is aimed
     again once that has settled (a smooth scroll aimed at the first position stopped short of the card) */
  if (C.jump) D.addEventListener('click', function(e){ var a = e.target.closest && e.target.closest(C.jump.split(',').map(function(s){ return s.trim() + ' a[href^="#"]'; }).join(', ')); if (!a) return; var id = a.getAttribute('href').slice(1);
    [350, 700].forEach(function(t){ setTimeout(function(){ var el = D.getElementById(id); if (!el) return; var top = el.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * 0.35) el.scrollIntoView({ block: 'start' }); }, t); }); });
  /* the paper: headings as written, examples back in their boxes */
  function paper(on){
    printing = on;
    $$('[data-fx2-orig]').forEach(function(h){ if (h.children.length) return; var s = on ? h.getAttribute('data-fx2-orig') : sentence(h.getAttribute('data-fx2-orig')); setText(h, s); if (!on) attr(h, 'data-fx2-set', s); });
    /* v25.67 fx2: a heading with a badge keeps its words in data-fx2-origt too, so a copy the form makes of a sheet for
       paper gets them back (SP-1 copies its sheets for the print set as the print media starts, which can come first) */
    $$('[data-fx2-origt]').forEach(function(h){ var tn = firstText(h), o = tn ? (tn._fx2o != null ? tn._fx2o : h.getAttribute('data-fx2-origt')) : null;
      if (o != null && o !== '1') { tn.nodeValue = on ? o : sentence(o); tn._fx2s = tn.nodeValue; tn._fx2o = o; } });
    $$('[data-fx2-ph]').forEach(function(f){ if (on) f.setAttribute('placeholder', f.getAttribute('data-fx2-ph')); else f.removeAttribute('placeholder'); });
  }
  window.addEventListener('beforeprint', function(){ paper(true); });
  window.addEventListener('afterprint', function(){ paper(false); });
  try { var pm = matchMedia('print'); var pf = function(e){ paper(e.matches); }; if (pm.addEventListener) pm.addEventListener('change', pf); else pm.addListener(pf); } catch (e) {}
  /* the workstation's packet collects a form after nbhPolish.plain(true), not on the browser's print: the paper headings
     and the examples in their boxes go into the packet too */
  function wrapPlain(){ try { var P = window.nbhPolish; if (P && P.plain && !P.plain.fx2) { var pl = P.plain; P.plain = function(on){ if (on) paper(true); var r = pl.apply(this, arguments); if (!on) paper(false); return r; }; P.plain.fx2 = true; } } catch (e) {} }
  /* nbh-polish may load after this script (the release build puts it last): wrapped as soon as it is there */
  wrapPlain(); D.addEventListener('DOMContentLoaded', wrapPlain); addEventListener('load', wrapPlain);
  window.fx2Layout = { run: run, paper: paper };
  paperCSS(); segs(); run();
  try { new MutationObserver(function(recs){ segs(); if (recs.some(function(m){ return !(m.target.closest && m.target.closest('.fx2-csum,.fx2-nsbar,.fx2-pkall,.fx2-addrow')); })) soon(); }).observe(D.body, { childList: true, subtree: true }); } catch (e) {}
  D.addEventListener('change', soon); D.addEventListener('input', function(e){ if (e.target._fx2eg) egSync(e.target); if (LIVE && e.target.closest && e.target.closest(LIVE)) soon(); });
  addEventListener('resize', function(){ tbKey = ''; soon(); });
})();
