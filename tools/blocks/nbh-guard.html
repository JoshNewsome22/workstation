<style id="nbh-guard-css">
/* the quick Save in the compact toolbar (v21.33): shown only while the rest of the toolbar is folded away */
#nbhSaveQuick{display:none}
html.nbh-compact #nbhSaveQuick{display:inline-block}
#nbhSaveQuick.dirty{background:#E7EDF2;color:var(--ink,#16242e);border-color:#E7EDF2;font-weight:600}
</style>
<script id="nbh-guard">
/* ===================== leaving with unsaved work (v21.33) =====================
   A form keeps nothing in the browser, by design, so the only copy of what was typed is the open
   window until Save data writes a file. Opened on its own (not inside the workstation, which keeps
   its own guard and an autosave), the form now asks before the tab closes or reloads while it holds
   entries changed since the last save. Opening a file counts as saved. Spell-check is turned on
   explicitly for every text field, since the browser default differs by platform, and the compact
   toolbar (More controls folded) shows a Save button of its own, so saving on an iPad is one tap.
   v21.44: the unsaved mark also follows the form's whole state (window.nbhState, the nbh-autosave block), so a tap that
   changes the record counts as typing does, and the bridge's silent save (the workstation's Autosave, a case save) is
   not the user's Save, so it never clears the mark. An iPad ignores the leave warning; the safety copy covers it there. */
(function(){
  var dirty = false, opening = false;   /* opening: Open data was the last button pressed (v21.86) */
  function isField(t){ return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') && t.type !== 'file'; }
  function saveButton(){
    return document.querySelector('#saveBtn,#btnSave,#dl-json') ||
      Array.prototype.filter.call(document.querySelectorAll('button'), function(b){ return /^\s*save data\s*$/i.test(b.textContent); })[0] || null;
  }
  document.addEventListener('input', function(e){ if (isField(e.target)) dirty = true; }, true);
  document.addEventListener('change', function(e){
    if (e.target && e.target.type === 'file') { if (opening) { opening = false; setTimeout(function(){ dirty = false; saved(); paint(); }, 900); } return; }   /* a file opened with Open data is the saved state; a photo, a picture or another form's file read in is a change (v21.86) */
    if (isField(e.target)) dirty = true;
    paint();
  }, true);
  document.addEventListener('click', function(e){
    if (window.__nbhQuiet) return;   /* v21.44 the bridge pressing Save for the workstation, not the user */
    var b = e.target && e.target.closest ? e.target.closest('button') : null; if (!b) return;
    if (b.id === 'nbhSaveQuick') return;
    if (b.matches('#loadBtn,#btnLoad,#up-json') || /^\s*open data\s*$/i.test(b.textContent)) opening = true; else if (!b.closest('dialog')) opening = false;
    if (b.matches('#saveBtn,#btnSave,#dl-json') || /^\s*save data\s*$/i.test(b.textContent)) { setTimeout(function(){ dirty = false; saved(); paint(); }, 300); }
    else if (b.id === 'clearBtn' || /^\s*clear all\s*$/i.test(b.textContent)) afterClear(function(){ dirty = false; saved(); paint(); });   /* v22.06 only once really cleared */
  }, true);
  window.addEventListener('beforeunload', function(ev){
    if (window.parent !== window) return;
    if (!isDirty()) return;
    ev.preventDefault(); ev.returnValue = '';
  });
  function isDirty(){ return dirty || !!(window.nbhState && window.nbhState.unsaved()); }
  function saved(){ if (window.nbhState) window.nbhState.markSaved(); }
  function paint(){ var q = document.getElementById('nbhSaveQuick'); if (q) q.classList.toggle('dirty', isDirty()); }
  setInterval(paint, 2000);
  window.nbhGuard = { isDirty: isDirty, clean: function(){ dirty = false; saved(); paint(); } };
  /* v22.06 Clear all counts the form as clean only once the form has really been cleared: its state changes after the
     tap (the question answered Clear). Cancel leaves it as it was, so nothing is marked; typing again ends the wait. */
  function afterClear(done){
    var S = window.nbhState; if (!S || !S.sig || !S.now) { setTimeout(done, 300); return; }
    var was = null, stop = false, n = 0;   /* the state at the tap, worked out now (the last one kept may be a few keys old) */
    function quit(){ stop = true; document.removeEventListener('input', quit, true); document.removeEventListener('keydown', quit, true); }
    document.addEventListener('input', quit, true); document.addEventListener('keydown', quit, true);
    (function look(){ if (stop) return; Promise.resolve(S.now()).then(function(sig){ if (stop) return;
      if (was === null) was = sig; else if (sig !== was) { quit(); done(); return; }
      if (++n < 100) setTimeout(look, 300); else quit(); }, function(){ if (!stop && ++n < 100) setTimeout(look, 300); }); })();
  }
  /* v22.06 Clear all counts the form as clean only once the form has really been cleared: its state changes after the
     tap (the question answered Clear). Cancel leaves it as it was, so nothing is marked; typing again ends the wait. */
  function afterClear(done){
    var S = window.nbhState; if (!S || !S.sig || !S.now) { setTimeout(done, 300); return; }
    var was = S.sig(), stop = false, n = 0;
    function quit(){ stop = true; document.removeEventListener('input', quit, true); document.removeEventListener('keydown', quit, true); }
    document.addEventListener('input', quit, true); document.addEventListener('keydown', quit, true);
    (function look(){ if (stop) return; Promise.resolve(S.now()).then(function(sig){ if (stop) return;
      if (sig !== was) { quit(); done(); return; }
      if (++n < 100) setTimeout(look, 300); else quit(); }, function(){ if (!stop && ++n < 100) setTimeout(look, 300); }); })();
  }

  /* the quick Save beside More controls */
  function addQuick(){
    if (document.getElementById('nbhSaveQuick')) return true;
    var more = document.getElementById('nbhMoreBtn'); if (!more || !more.parentNode) return false;
    var sb = saveButton(); if (!sb) return true;
    var q = document.createElement('button'); q.type = 'button'; q.id = 'nbhSaveQuick'; q.textContent = 'Save data';
    q.title = 'Save this form to a file (the same as Save data under More controls)';
    q.addEventListener('click', function(){ sb.click(); });
    more.parentNode.insertBefore(q, more);
    paint(); return true;
  }
  var tries = 0, t = setInterval(function(){ if (addQuick() || ++tries > 20) clearInterval(t); }, 250);

  /* spell-check on, explicitly */
  function spell(root){
    var list = (root.querySelectorAll ? root : document).querySelectorAll('textarea,input[type="text"],input:not([type])');
    for (var i = 0; i < list.length; i++) if (!list[i].hasAttribute('spellcheck')) list[i].setAttribute('spellcheck', 'true');
  }
  spell(document);
  try {
    new MutationObserver(function(ms){ for (var i = 0; i < ms.length; i++) { var a = ms[i].addedNodes; for (var j = 0; j < a.length; j++) if (a[j].nodeType === 1) spell(a[j]); } })
      .observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}
})();
</script>
