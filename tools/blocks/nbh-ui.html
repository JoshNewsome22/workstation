<style id="nbh-ui-css">
/* ===== the form's own messages, touch targets and view progress (v21.34) ===== */
/* toasts: short messages that do not stop the work */
#nbhToasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9000;pointer-events:none;max-width:min(560px,calc(100% - 32px))}
.nbh-toast{pointer-events:auto;background:#16242e;color:#f1f6f5;font:13.5px/1.45 var(--nbh-sans,system-ui,sans-serif);padding:10px 16px;border-radius:8px;box-shadow:0 12px 30px -12px rgba(22,36,46,.6);display:flex;gap:12px;align-items:flex-start;animation:nbhToastIn .18s ease-out}
.nbh-toast.warn{background:#7a2e1a}
.nbh-toast.ok{background:#1f5b3f}
.nbh-toast button{margin-left:auto;border:0;background:transparent;color:#cfe0dd;font:inherit;cursor:pointer;padding:0 2px;line-height:1}
@keyframes nbhToastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* the styled confirm and notice */
#nbhUiDlg{border:1px solid #c9d4d2;border-radius:8px;padding:0;max-width:560px;width:calc(100% - 32px);font-family:var(--nbh-sans,system-ui,sans-serif);font-size:14px;color:#16242e;background:#fff;box-shadow:0 30px 70px -24px rgba(24,46,67,.55)}
#nbhUiDlg::backdrop{background:rgba(22,36,46,.38)}
#nbhUiDlg .u-h{padding:14px 18px 10px;font-weight:600;font-size:15.5px;line-height:1.35;font-family:var(--nbh-serif,Georgia,serif);color:#182e43}
#nbhUiDlg .u-b{padding:0 18px 14px;line-height:1.5;white-space:pre-line;color:#2b3a44;max-height:50vh;overflow:auto}
#nbhUiDlg .u-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px;border-top:1px solid #e3eae8;background:#f7f9f8;border-radius:0 0 8px 8px}
#nbhUiDlg .u-f button{font:inherit;font-size:13.5px;padding:8px 16px;min-height:40px;border:1px solid #c9d4d2;border-radius:4px;background:#fff;color:#16242e;cursor:pointer}
#nbhUiDlg .u-f button.primary{background:#182e43;color:#fff;border-color:#182e43;font-weight:600}
#nbhUiDlg .u-f button.danger{background:#a8321e;color:#fff;border-color:#a8321e;font-weight:600}
@media print{#nbhToasts,#nbhUiDlg{display:none!important}}
/* view progress: a dot after each view's name */
#viewSeg button[data-nbh-fill]::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:7px;vertical-align:1px;border:1px solid rgba(255,255,255,.55);background:transparent}
#viewSeg button[data-nbh-fill="part"]::after{background:#e3b341;border-color:#e3b341}
#viewSeg button[data-nbh-fill="done"]::after{background:#6fcf97;border-color:#6fcf97}
#viewSeg button[data-nbh-fill="none"]::after{display:none}
/* touch: on a device without a fine pointer, the small controls grow */
@media (pointer:coarse){
  .rowDel,.delRow,button.rowDel{font-size:22px!important;padding:8px 12px!important;min-width:44px!important;min-height:44px!important}
  td.nx,th.nx,table.grid.narr th.nx,table.grid.narr td.nx{width:48px!important}
  input[type="checkbox"],input[type="radio"]{width:22px!important;height:22px!important;min-width:22px!important}
  .checks label,.chk label{padding:6px 0!important;min-height:36px}
  button.iv{height:36px!important}
  .toolbar button,.toolbar select,.toolbar input{min-height:40px!important;padding-top:8px!important;padding-bottom:8px!important}
  .sheet input:not([type="checkbox"]):not([type="radio"]),.sheet select{min-height:38px!important}
  .sheet textarea{min-height:44px!important}
  .sheet button,.tool,.nbh-btn{min-height:40px!important}
  .nbh-pagenav button{min-height:44px!important}
  #nbhCaseDlg .nbhc-s label{padding:9px 0!important}
}
/* v21.78 the iPad audit (32 px a target): a checkbox or radio is 24 px, a checkbox label's tap area 36 px high, the narrow
   grid buttons 34 px wide, the walkthrough's links taller; a table cell with one checkbox or radio is its target (the script
   below). Screen only: what prints on an iPad stays as it was. */
@media screen and (pointer:coarse){
  input[type="checkbox"],input[type="radio"]{width:24px!important;height:24px!important;min-width:24px!important}
  label.ck,label.chk,label.ind,.ckrow label{padding-top:7px!important;padding-bottom:7px!important}
  button.pq,button.cell,button.tb1-del,button.tool,.toolbar button{min-width:34px!important}
  a.wk-go{display:inline-block;padding:9px 0!important}
  td.nbh-celltap{cursor:pointer}
}
/* v21.81 touch: the toolbar's buttons and fields, the view buttons, the tool buttons and the page bar are 44 px tall (Apple's
   minimum); a checkbox in the toolbar keeps its own size and its label, 44 px tall, is the target. Screen only. */
@media screen and (pointer:coarse){
  .toolbar button,.toolbar select,.toolbar input:not([type="checkbox"]):not([type="radio"]),#viewSeg button,button.tool,button.nbh-btn,.nbh-pagenav button{min-height:44px!important}
  .toolbar input[type="checkbox"],.toolbar input[type="radio"]{min-height:0!important;padding:0!important}
  .toolbar label:has(> input[type="checkbox"]),.toolbar label:has(> input[type="radio"]){display:inline-flex;align-items:center;min-height:44px}
}
/* v21.81 iPad in portrait (834 px wide or less): text a form sets under 12 px (field labels at 11.5 px, the toolbar's "View"
   at 10 px, table heads, notes) reads at 13 px. The script below marks each such element (data-nbh-fs) and only this
   screen rule sizes it, so paper never changes; :not(#nbh-none) outweighs a form's own !important size, and a size a
   script sets on the element itself (text fitted to a card) still wins. */
@media screen and (max-width:834px){
  html:not(#nbh-none) body [data-nbh-fs]:not([style*="font-size"]){font-size:13px!important}
}
/* ---- inside the workstation (v21.36): one dark band is enough, so the form's toolbar goes light when framed ---- */
html.nbh-framed .toolbar{background:var(--nbh-mist,#eaf2f0);color:var(--nbh-navy,#182e43);box-shadow:0 1px 0 var(--nbh-rule,#cfdad8)}
html.nbh-framed .tgroup > span,html.nbh-framed .toolbar .lbl,html.nbh-framed .toolbar label{color:var(--nbh-muted,#54676f)}
html.nbh-framed .toolbar select,html.nbh-framed .toolbar input[type=number],html.nbh-framed .toolbar input[type=text],html.nbh-framed .toolbar input[type=date]{background:#fff;color:var(--nbh-navy,#182e43);border-color:var(--nbh-field,#b7c8c5)}
html.nbh-framed .toolbar button{background:#fff;color:var(--nbh-navy,#182e43);border-color:var(--nbh-field,#b7c8c5)}
html.nbh-framed .toolbar button:hover{background:var(--nbh-mint,#bcd9d4)}
html.nbh-framed .toolbar button.primary{background:var(--nbh-navy,#182e43);color:#fff;border-color:var(--nbh-navy,#182e43)}
html.nbh-framed .toolbar button.primary:hover{background:var(--nbh-slate,#254657)}
html.nbh-framed .seg{border-color:var(--nbh-field,#b7c8c5)}
html.nbh-framed .seg button,html.nbh-framed .toolbar #viewSeg{background:#fff}
html.nbh-framed .seg button[aria-pressed=true]{background:var(--nbh-navy,#182e43);color:#fff}
html.nbh-framed .toolbar :focus-visible{outline:2px solid var(--nbh-focus,#2f7fa8)}
html.nbh-framed #viewSeg button[data-nbh-fill]::after{border-color:rgba(24,46,67,.4)}
html.nbh-framed #viewSeg button[aria-pressed=true][data-nbh-fill]::after{border-color:rgba(255,255,255,.6)}
html.nbh-framed .nbh-case-grp button.nbhc-on{background:var(--nbh-mint,#bcd9d4);color:var(--nbh-navy,#182e43)}
/* v21.83 on an iPad (or any window 1194 px wide or less) the form's pinned toolbar folds to its view buttons on one line, a
   44 px strip with a "Tools" button, while the user reads down the form or types in a field (the script below sets
   html.nbh-fold); it unfolds on scrolling up, at the top, on a tap on the strip or on Tools. The space the bar gave up is
   kept below it (--nbh-fold-gap), so nothing on the page moves. Screen only: paper never sees any of it. */
#nbhFoldBtn{display:none}
@media screen{
  html.nbh-fold .toolbar{flex-wrap:nowrap!important;align-items:center!important;padding-top:3px!important;padding-bottom:3px!important;row-gap:0!important;margin-bottom:var(--nbh-fold-gap,0px)!important;animation:nbhFoldIn .18s ease-out}
  html.nbh-fold .toolbar > :not(.nbh-fk):not(.nbh-fseg):not(#nbhFoldBtn),html.nbh-fold .toolbar .nbh-fk > :not(.nbh-fk):not(.nbh-fseg){display:none!important}
  html.nbh-fold .toolbar .nbh-fk{display:flex!important;flex:1 1 auto!important;min-width:0!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;flex-wrap:nowrap!important}
  html.nbh-fold .toolbar .nbh-fseg{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;max-width:100%!important;min-width:0!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  html.nbh-fold .toolbar .nbh-fseg::-webkit-scrollbar{display:none}
  html.nbh-fold .toolbar .nbh-fseg > *,html.nbh-fold .toolbar #viewSeg.nbh-fseg > *{flex:0 0 auto!important;white-space:nowrap!important;height:36px!important;min-height:36px!important;padding-top:0!important;padding-bottom:0!important}
  html.nbh-fold .toolbar #nbhFoldBtn{display:inline-flex!important;align-items:center;flex:0 0 auto;margin:0 0 0 8px;height:38px!important;min-height:38px!important;padding:0 14px!important;font-weight:600;white-space:nowrap}
  html.nbh-unfolding .toolbar{animation:nbhUnfold .2s ease-out}
}
@keyframes nbhFoldIn{from{opacity:.55;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes nbhUnfold{from{-webkit-clip-path:inset(0 0 var(--nbh-fold-d,0px) 0);clip-path:inset(0 0 var(--nbh-fold-d,0px) 0)}to{-webkit-clip-path:inset(0);clip-path:inset(0)}}
@media (prefers-reduced-motion:reduce){html.nbh-fold .toolbar,html.nbh-unfolding .toolbar{animation:none!important}}
@media print{#nbhFoldBtn{display:none!important}}
/* v21.89 the layout review: the view tabs take the room they need (not half the toolbar), the empty strip of a masthead inside
   the workstation goes (on screen; the printed letterhead is untouched), and reading text keeps a comfortable line on a wide screen */
html.nbh-compact .toolbar > .tgroup.tg-keep:has(#viewSeg){flex:1 1 auto}
@media screen{html.nbh-framed .nbh-mast:not(:has(button:not([hidden]))){display:none}
  .sheet p.hint,.sheet p.lead{max-width:78ch}}

<script id="nbh-ui">
/* ===================== the form's own messages, touch targets and view progress (v21.34) =====================
   Until now every notice was the browser's alert() and every question its confirm(): unstyled, "this site
   says", and on an iPad a stop to the whole screen. This block gives each form:
     nbhUI.toast(text, {kind:'ok'|'warn'|'', ms})   a short message at the foot of the window
     nbhUI.alert(text)                              a toast for a short message, a styled notice for a long one
     nbhUI.confirm(text, {ok, cancel, danger})      a styled question; resolves true or false
   window.alert is routed through nbhUI.alert, so existing calls change on their own. window.confirm stays
   the browser's, because a synchronous answer cannot be styled; the forms' own code calls
   nbhUI.confirm instead (await it). A test that replaces window.confirm with its own function is
   honoured: nbhUI.confirm then returns that function's answer at once, so checks that auto-accept keep
   working. The block also marks each view button with a dot (empty, partly filled, filled) from the
   fields that view shows, and grows the small controls on a touch screen (the CSS above). */
(function(){
  var U = {}, nativeConfirm = window.confirm, nativeAlert = window.alert;
  function q(s){ return document.querySelector(s); }
  function host(){ var h = q('#nbhToasts'); if (!h) { h = document.createElement('div'); h.id = 'nbhToasts'; h.setAttribute('role', 'status'); h.setAttribute('aria-live', 'polite'); document.body.appendChild(h); } return h; }

    var s = document.createElement('span'); s.textContent = String(text); t.appendChild(s);
    var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'Dismiss'); x.innerHTML = '&times;'; t.appendChild(x);
    var gone = function(){ if (t.parentNode) t.parentNode.removeChild(t); };
    x.addEventListener('click', gone);
    h.appendChild(t);
    while (h.children.length > 3) h.removeChild(h.firstChild);
    setTimeout(gone, opt.ms || Math.min(12000, 3500 + String(text).length * 35));
    return t;
  };
  function dlg(){
    var d = q('#nbhUiDlg');
    if (d) return d;
    d = document.createElement('dialog'); d.id = 'nbhUiDlg'; d.className = 'noprint'; d.setAttribute('aria-labelledby', 'nbhUiH'); d.setAttribute('aria-describedby', 'nbhUiB');
    d.innerHTML = '<div class="u-h" id="nbhUiH"></div><div class="u-b" id="nbhUiB"></div><div class="u-f" id="nbhUiF"></div>';
    document.body.appendChild(d);
    return d;
  }
  function split(text){
    var s = String(text == null ? '' : text).trim(), i = s.indexOf('\n');
    var first = i >= 0 ? s.slice(0, i).trim() : s, rest = i >= 0 ? s.slice(i + 1).trim() : '';
    if (first.length > 120 && i < 0) { var j = first.indexOf('. '); if (j > 20 && j < 110) { rest = first.slice(j + 2); first = first.slice(0, j + 1); } }
    return { head: first, body: rest };
  }
  function ask(text, opt, question){
    opt = opt || {};
    return new Promise(function(res){
      var d = dlg(), p = split(text);
      q('#nbhUiH').textContent = p.head; q('#nbhUiB').textContent = p.body; q('#nbhUiB').style.display = p.body ? '' : 'none';
      var f = q('#nbhUiF'); f.innerHTML = '';
      var done = function(v){ try { d.close(); } catch (e) {} res(v); };
      if (question) { var c = document.createElement('button'); c.type = 'button'; c.textContent = opt.cancel || 'Cancel'; c.addEventListener('click', function(){ done(false); }); f.appendChild(c); }
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = opt.danger ? 'danger' : 'primary'; ok.textContent = opt.ok || (question ? 'OK' : 'OK');

      d.oncancel = function(ev){ ev.preventDefault(); done(false); };
      if (d.showModal) d.showModal(); else d.setAttribute('open', '');
      ok.focus();
    });

  U.alert = function(text){
    if (window.__nbhSilent) return Promise.resolve();

    return ask(text, opt || {}, true);

  window.alert = function(m){ U.alert(m); };

  /* ---- view progress ---- */
  var MAP = null, timer = null;
  function fields(root){
    var out = [], list = root.querySelectorAll('input,select,textarea');
    for (var i = 0; i < list.length; i++) { var e = list[i]; if (e.type === 'file' || e.type === 'hidden' || e.type === 'button' || e.type === 'submit' || e.closest('.toolbar,#nbhCaseDlg,#nbhUiDlg,.nbh-pagenav,.obr')) continue; out.push(e); }

  function vis(e){ return !!(e.offsetParent || (e.getClientRects && e.getClientRects().length)); }

    if (MAP && Object.keys(MAP).some(function(k){ return MAP[k].some(function(e){ return !e.isConnected; }); })) MAP = null;
    if (!MAP) MAP = buildMap();
    if (!MAP) return null;
    var out = {}, own = typeof window.__nbhViewFill === 'function' ? window.__nbhViewFill : null;
    Object.keys(MAP).forEach(function(k){
      var list = MAP[k].filter(function(e){ return e.isConnected; }), n = 0;
      list.forEach(function(e){ if (filled(e)) n++; });
      /* a form can count a view itself (Form TK-1: a card with a picture is filled; its label is optional) */
      var o = null; if (own) { try { o = own(k); } catch (e) { o = null; } }
      if (o && typeof o.total === 'number' && typeof o.filled === 'number') { n = o.filled; list = { length: o.total }; }
      out[k] = { filled: n, total: list.length };
      var b = document.querySelector('#viewSeg button[data-view="' + k + '"]');
      if (b) {
        var st = !list.length ? 'none' : n === 0 ? 'empty' : n >= Math.max(1, Math.round(list.length * 0.8)) ? 'done' : 'part';
        if (b.dataset.nbhFill !== st) b.dataset.nbhFill = st;
        var tip = list.length ? n + ' of ' + list.length + ' fields filled' : '';
        if (b.title !== tip) b.title = tip;
      }
    });
    return out;
  };
  U.remap = function(){ MAP = null; U.progress(); };
  function soon(ms){ clearTimeout(timer); timer = setTimeout(function(){ try { U.progress(); } catch (e) {} }, ms || 400); }
  document.addEventListener('input', function(){ soon(500); }, true);
  document.addEventListener('change', function(){ soon(300); }, true);
  var remapTimer = null, lastCount = -1;
  function maybeRemap(){
    clearTimeout(remapTimer);
    remapTimer = setTimeout(function(){ var n = document.querySelectorAll('input,select,textarea').length; if (n !== lastCount) { lastCount = n; MAP = null; } try { U.progress(); } catch (e) {} }, 900);
  }
  try { new MutationObserver(maybeRemap).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  window.addEventListener('load', function(){ setTimeout(function(){ try { lastCount = document.querySelectorAll('input,select,textarea').length; U.progress(); } catch (e) {} }, 400); });
  /* v21.78 on a touch screen a table cell holding one checkbox or radio (and nothing else to press) is its target: a tap
     anywhere in the cell ticks it, as if the box were the size of the cell */
  try { if (window.matchMedia && matchMedia('(pointer:coarse)').matches) document.addEventListener('click', function(e){
    var t = e.target; if (!t || !t.closest || t.closest('input,label,button,select,textarea,a,summary')) return;
    var td = t.closest('td,th'); if (!td) return; var c = td.querySelectorAll('input,select,textarea,button,a');
    if (c.length !== 1) return; var i = c[0]; if ((i.type !== 'checkbox' && i.type !== 'radio') || i.disabled) return; i.click();
  }, false); } catch (e) {}
  /* v21.81 iPad in portrait: mark the elements whose own words the form sets under 12 px (not drawings, not fields, not a
     size a script set on the element, not the walkthrough's drawn stage) so the screen-only rule above shows them at
     13 px. A marked parent can bring an em-sized child up, so it looks again (three rounds at most); rows the form draws
     later are looked at when added. All the sizes are read before any mark is written, to keep it quick. A data
     attribute, so a form setting className keeps the mark. */
  try { if (window.matchMedia) (function(){
    var mq = matchMedia('screen and (max-width:834px)'), HTML = 'http://www.w3.org/1999/xhtml', SKIP = /^(SCRIPT|STYLE|INPUT|SELECT|TEXTAREA|OPTION|TEMPLATE|NOSCRIPT)$/, STAGE = '#wkStage,.wk-stage', pend = [], timer = 0;

    try { new MutationObserver(function(recs){
      if (!mq.matches) return;
      recs.forEach(function(m){ for (var i = 0; i < m.addedNodes.length; i++) if (m.addedNodes[i].nodeType === 1) pend.push(m.addedNodes[i]); });
      if (pend.length && !timer) timer = setTimeout(later, 500);
    }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
    if (mq.addEventListener) mq.addEventListener('change', all); else if (mq.addListener) mq.addListener(all);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', all); else all();
    window.addEventListener('load', function(){ setTimeout(all, 300); });
  })(); } catch (e) {}
