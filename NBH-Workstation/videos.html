<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video library · FBA and BIP Workstation</title>
<!-- v25.69 (the BCBA, 11/8: "a video layout dashboard like YouTube ... that can show all the video protocols that I have in
     the bank") the video library: every procedure video of Form TD-1's protocol bank, to browse and to watch. The list is
     nbh-videos.js (the one Form TD-1 reads); each video is a file beside the forms, loaded only when it is watched, and its
     picture a small JPG beside it, so the installed app plays them without the internet. Opened from the workstation's
     Videos (over the workstation, in a frame) or on its own; videos.html#video=<key> opens a video's page. What was watched
     on this device, and where each video stopped, is kept in this browser (localStorage nbh.videos.v1): the video's key,
     the second and the time, nothing about a student. -->
<script>
/* the workstation's text size, contrast and low light (localStorage nbh.view, as the forms read it), before the page draws */
(function(){var R=document.documentElement;try{if(window.parent!==window)R.classList.add('nbh-framed');}catch(e){}
 try{var v=JSON.parse(localStorage.getItem('nbh.view')||'{}')||{};R.classList.toggle('nbh-tx-1',v.t===1);R.classList.toggle('nbh-tx-2',v.t===2);R.classList.toggle('nbh-hc',!!v.hc);R.classList.toggle('nbh-dark',!!v.dark);}catch(e){}})();
</script>
<style>
:root{--ink:#1F2D36;--navy:#1D3A52;--wash:#F2F6F5;--paper:#fff;--rule:#D9E2E0;--box:#B9C7C4;--muted:#55656C;--chip:#E5EDEB;--chip-h:#D8E4E1;
  --focus:#2f7fa8;--prog:#2f7fa8;--ai-ink:#7a4f00;--ai-bg:#fff4dc;--ai-rule:#e7c27a;
  --sans:"Inter","Helvetica Neue","Segoe UI",Arial,system-ui,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --gut:24px;--r:12px;font-size:16px}
html.nbh-tx-1{font-size:18px}html.nbh-tx-2{font-size:20px}
html.nbh-hc{--ink:#000;--muted:#263238;--rule:#5e7673;--box:#3f5654;--focus:#0a4f75;--chip:#dbe5e3}
/* low light: on its own the page turns dark; in the workstation the workstation turns it (its whole window), and only the
   pictures are turned back here */
@media screen{html.nbh-dark:not(.nbh-framed){filter:invert(1) hue-rotate(180deg);background:#fff}
  html.nbh-dark img,html.nbh-dark video{filter:invert(1) hue-rotate(180deg)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wash);color:var(--ink);font:400 1rem/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vl-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.vl-skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.vl-skip:focus{top:8px}
.vl-wrap{max-width:1680px;margin:0 auto;padding:0 var(--gut)}
.vl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--box);border-radius:10px;
  background:var(--paper);color:var(--navy);font-weight:600;font-size:.9375rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.vl-btn:hover{background:#eef3f5;border-color:#93aead}
.vl-btn svg{width:18px;height:18px;flex:0 0 auto}
.vl-btn.vl-pri{background:var(--navy);border-color:var(--navy);color:#fff}
.vl-btn.vl-pri:hover{background:#254657}
.vl-ai{display:inline-block;font-size:.8125rem;font-weight:700;color:var(--ai-ink);background:var(--ai-bg);border:1px solid var(--ai-rule);border-radius:999px;padding:2px 10px;white-space:nowrap;line-height:1.5}

/* ---------- the top: the title, the search, Close (in the workstation) ---------- */
.vl-head{position:sticky;top:0;z-index:20;background:rgba(242,246,245,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.vl-head.vl-stuck{border-bottom-color:var(--rule)}
.vl-hrow{display:flex;align-items:center;gap:12px 16px;min-height:72px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.vl-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.vl-mark{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.vl-mark svg{width:22px;height:22px}
.vl-head h1{margin:0;font:600 1.625rem/1.15 var(--serif);color:var(--navy);white-space:nowrap}
.vl-search{flex:1 1 320px;max-width:560px;margin-left:auto;position:relative}
.vl-search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.vl-search input{width:100%;min-height:48px;font-size:16px;padding:0 14px 0 42px;border:1px solid var(--box);border-radius:999px;background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
.vl-search input::placeholder{color:#6b7b82}
.vl-search input:focus{outline:3px solid #9DBAD3;outline-offset:0;border-color:var(--navy)}
#vlClose[hidden],#vlBack[hidden],.vl-search[hidden]{display:none}
body.vl-watching .vl-search{display:none}
body.vl-watching #vlClose{margin-left:auto}

/* ---------- the chips ---------- */
.vl-chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 4px;align-items:center}
.vl-chip{position:relative;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--chip);color:var(--ink);font-weight:500;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.vl-chip:hover{background:var(--chip-h)}
.vl-chip[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.vl-chip .vl-n{font-size:.8125rem;opacity:.75;margin-left:6px;font-weight:500}
.vl-cdiv{width:1px;align-self:stretch;margin:8px 4px;background:var(--box)}
.vl-count{margin:10px 0 0;color:var(--muted);font-size:.9375rem;min-height:1.45em}
.vl-intro{margin:2px 0 6px;color:var(--muted);font-size:.9375rem;max-width:90ch}

/* ---------- a shelf (Continue watching, one per procedure) and the grid ---------- */
.vl-sec{margin:28px 0 8px}
.vl-sech{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.vl-shd{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-width:0;flex:1 1 auto}
.vl-sech h2{margin:0;font:600 1.375rem/1.2 var(--serif);color:var(--navy)}
.vl-sech .vl-sub{color:var(--muted);font-size:.9375rem}
.vl-sech .vl-btn{margin-left:auto;min-height:44px;font-size:.875rem;padding:0 14px;flex:0 0 auto}
@media (max-width:699px){.vl-sech h2{font-size:1.1875rem}.vl-shd{flex-direction:column;gap:2px}}
.vl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
.vl-row{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 40px)/3.3);gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:-2px}
.vl-row>*{scroll-snap-align:start}
@media (min-width:1700px){.vl-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.vl-row{grid-auto-columns:calc((100% - 60px)/4.3)}}
@media (max-width:1099px){.vl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.vl-row{grid-auto-columns:calc((100% - 20px)/2.3)}}
@media (max-width:699px){:root{--gut:16px}.vl-grid{grid-template-columns:minmax(0,1fr);gap:24px}.vl-row{grid-auto-columns:82%}
  .vl-chips{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;margin:0 calc(-1*var(--gut));padding:6px var(--gut) 8px;scrollbar-width:none}
  .vl-chips::-webkit-scrollbar{display:none}.vl-head h1{font-size:1.375rem}.vl-hrow{min-height:60px}.vl-search{flex-basis:100%;max-width:none;order:3}
  .vl-mark{width:34px;height:34px;border-radius:10px}#vlClose{margin-left:auto}
  body.vl-watching .vl-brand{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}}

/* ---------- a video's card ---------- */
.vl-card{display:block;color:inherit;text-decoration:none;border-radius:var(--r);min-width:0;-webkit-tap-highlight-color:transparent}
.vl-card:focus-visible{outline-offset:4px}
.vl-thumb{display:block;position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#cfd9d7;box-shadow:0 1px 2px rgba(16,36,48,.08)}
.vl-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
@media (hover:hover){.vl-card:hover .vl-thumb img{transform:scale(1.03)}}
.vl-dur{position:absolute;right:8px;bottom:8px;background:rgba(14,24,32,.84);color:#fff;font:600 .8125rem/1 var(--sans);padding:4px 6px;border-radius:6px;letter-spacing:.01em}
.vl-pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.55)}
.vl-pbar i{display:block;height:100%;background:var(--prog)}
.vl-pbar~.vl-dur{bottom:12px}
.vl-seen{position:absolute;left:8px;top:8px;background:rgba(14,24,32,.84);color:#fff;font:600 .75rem/1 var(--sans);padding:5px 8px 5px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.vl-seen svg{width:13px;height:13px}
.vl-info{display:flex;gap:12px;padding:12px 2px 0;align-items:flex-start}
.vl-av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .6875rem/1 var(--sans);letter-spacing:.02em;background:var(--navy)}
.vl-f-dro{background:#1D3A52}.vl-f-ncr{background:#2f6b37}.vl-f-rird{background:#6b4a7a}.vl-f-highp{background:#9b4e15}.vl-f-fct{background:#22657a}
.vl-txt{position:relative;min-width:0;display:flex;flex-direction:column;gap:3px}
.vl-t{font-weight:600;font-size:1.0625rem;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vl-m{color:var(--muted);font-size:.875rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vl-st{color:var(--muted);font-size:.8125rem}
.vl-st b{color:#2f6b37;font-weight:600}
.vl-none{margin:40px 0;padding:28px;border-radius:var(--r);background:var(--paper);border:1px solid var(--rule);text-align:center}
.vl-none p{margin:0 0 12px}

/* ---------- a video's page ---------- */
.vl-w{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-top:8px;padding-bottom:40px;align-items:start}
@media (max-width:1179px){.vl-w{grid-template-columns:minmax(0,1fr)}}
.vl-player{position:relative;border-radius:var(--r);overflow:hidden;background:#0f1a22;aspect-ratio:16/9}
.vl-player video{display:block;width:100%;height:100%;background:#0f1a22}
.vl-load{position:absolute;inset:auto 0 0 0;padding:12px 16px;background:linear-gradient(transparent,rgba(10,18,24,.85));color:#fff;font-size:.9375rem}
.vl-load[hidden]{display:none}
.vl-load.vl-err{position:static;background:#fbe9e7;color:#7a2416;border-top:1px solid #e6b9b1}
.vl-kick{display:flex;align-items:center;gap:10px;margin:18px 0 6px;color:var(--muted);font-size:.9375rem}
.vl-kick .vl-av{width:32px;height:32px;font-size:.625rem}
.vl-w h2.vl-wt{margin:0;font:600 1.625rem/1.25 var(--serif);color:var(--navy)}
.vl-w h2.vl-wt:focus{outline:none}
.vl-w h2.vl-wt:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
.vl-wm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0 0;color:var(--muted);font-size:.9375rem}
.vl-resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 0;padding:6px 6px 6px 14px;background:#e8f1f6;border-radius:10px;font-size:.9375rem}
.vl-resume[hidden]{display:none}
.vl-resume .vl-btn{min-height:44px;margin-left:auto}
.vl-panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin:18px 0 0}
.vl-panel h3{margin:0 0 10px;font:600 1.0625rem/1.3 var(--sans);color:var(--ink)}
.vl-panel p{margin:0 0 10px;max-width:80ch}
.vl-panel p:last-child{margin-bottom:0}
.vl-opens{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vl-open{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;text-align:left;border:1px solid var(--box);border-radius:10px;background:var(--paper);cursor:pointer}
.vl-open:hover{background:#eef3f5;border-color:#93aead}
.vl-open svg{width:22px;height:22px;flex:0 0 auto;color:var(--navy)}
.vl-open span{display:flex;flex-direction:column;min-width:0}
.vl-open b{color:var(--navy);font-size:.9375rem}
.vl-open small{color:var(--muted);font-size:.8125rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vl-fns{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.vl-fns{align-items:center}.vl-fns b{font-weight:600;font-size:.875rem;color:var(--muted);margin-right:2px}
.vl-fns span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8125rem}
.vl-note{color:var(--muted);font-size:.9375rem}
/* Up next */
.vl-next h2{margin:0 0 12px;font:600 1.25rem/1.2 var(--serif);color:var(--navy)}
.vl-next h3{margin:16px 0 8px;font:700 .75rem/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vl-next h3:first-of-type{margin-top:0}
.vl-next ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vl-ni{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;align-items:start;color:inherit;text-decoration:none;border-radius:10px;padding:4px;margin:-4px;min-height:44px}
.vl-ni:hover{background:rgba(29,58,82,.06)}
.vl-ni .vl-thumb{border-radius:8px}
.vl-ni .vl-dur{right:5px;bottom:5px;font-size:.75rem;padding:3px 5px}
.vl-ni .vl-t{font-size:.9375rem}
.vl-ni .vl-m{font-size:.8125rem;-webkit-line-clamp:1}
@media (max-width:1179px){.vl-next ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}.vl-ni{grid-template-columns:minmax(120px,40%) minmax(0,1fr)}}
@media (max-width:699px){.vl-next ol{grid-template-columns:minmax(0,1fr)}.vl-w h2.vl-wt{font-size:1.375rem}.vl-player{border-radius:0;margin:0 calc(-1*var(--gut))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.vl-card:hover .vl-thumb img{transform:none}}
@media print{.vl-head,.vl-chips,.vl-next{display:none}}
</style>
<script src="nbh-videos.js"></script>
</head>
<body>
<a class="vl-skip" href="#vlMain">Skip to the videos</a>
<header class="vl-head" id="vlHead">
  <div class="vl-wrap vl-hrow">
    <button type="button" class="vl-btn" id="vlBack" hidden><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg><span>All videos</span></button>
    <div class="vl-brand"><span class="vl-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg></span><h1>Video library</h1></div>
    <div class="vl-search" role="search"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
      <label class="vl-sr" for="vlQ">Search the videos</label><input id="vlQ" type="search" placeholder="Search: a procedure, a study, a step" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <button type="button" class="vl-btn" id="vlClose" hidden aria-label="Close the video library">Close</button>
  </div>
</header>
<main id="vlMain" tabindex="-1">
  <section id="vlHome" class="vl-wrap" aria-label="All videos">
    <p class="vl-intro"><span class="vl-ai">AI-generated · simulated people</span> The procedure videos of Form TD-1’s protocol bank. Each shows a procedure, not a real session: adapt every step to the student’s plan.</p>
    <div class="vl-chips" id="vlChips" role="group" aria-label="Show"></div>
    <p class="vl-count" id="vlCount" role="status"></p>
    <div id="vlList"></div>
  </section>
  <section id="vlWatch" class="vl-wrap" hidden aria-labelledby="vlTitle"></section>
</main>
<script>
(function(){
'use strict';
var D=window.NBH_VIDEOS,R=document.documentElement,B=document.body;
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
if(!D||!D.list||!D.list.length){$('vlList').innerHTML='<div class="vl-none"><p>The list of videos (nbh-videos.js) could not be loaded. Open the workstation from its folder or from the website.</p></div>';return;}
var LIST=D.list,BY={},FAM={},FN={attention:'Attention',escape:'Escape',tangible:'Tangible',automatic:'Automatic'};
LIST.forEach(function(v){BY[v.key]=v;});D.families.forEach(function(f){FAM[f[0]]={key:f[0],short:f[1],name:f[2]};});
/* the workstation around this page (its Videos): Close, and a card opened in its Form TD-1 */
var WS=false;try{WS=window.parent!==window&&!!window.parent.__wsVideos;}catch(e){WS=false;}
var tell=function(m){try{window.parent.postMessage(m,'*');}catch(e){}};

/* ---------- what was watched on this device: localStorage nbh.videos.v1, {v:1, items:{key:{t,d,w,at}}} — the second a
   video stopped at (t), its length (d), watched to the end once (w), when (at). No student, nothing typed. ---------- */
var KEY='nbh.videos.v1';
function readStore(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o==='object'&&o.items&&typeof o.items==='object')return o;}catch(e){}return {v:1,items:{}};}
var store=readStore();
function writeStore(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function prog(k){var it=store.items[k];return it&&typeof it==='object'?it:null;}
function setProg(k,t,d,ended){if(!BY[k]||!(d>0))return;var p=prog(k)||{},w=!!p.w||!!ended||t>=d*0.95;
  store.items[k]={t:ended||t>=d-2?0:Math.max(0,Math.floor(t)),d:Math.round(d),w:w,at:Date.now()};writeStore();}
var inProgress=function(k){var p=prog(k);return !!p&&p.t>=5&&(!p.d||p.t<p.d-2);};
var watched=function(k){var p=prog(k);return !!p&&!!p.w;};
addEventListener('storage',function(e){if(e.key===KEY){store=readStore();if(view==='home')paintHome();}else if(e.key==='nbh.view')viewFromStore();});

/* ---------- words ---------- */
var mmss=function(s){s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;};
var spoken=function(s){s=Math.floor(s||0);var m=Math.floor(s/60),x=s%60;return (m?m+' minute'+(m>1?'s':''):'')+(m&&x?' ':'')+(x||!m?x+' second'+(x===1?'':'s'):'');};
function cite(v){if(v.after)return v.after;var c=(D.cards[v.cards[0]]||{}).cite||'';var m=/^(.*), (\d{4}[a-z]?)$/.exec(c.split('; ')[0]||'');return m?m[1]+' ('+m[2]+')':(c||'TD-1’s own steps');}
function citeOf(v){return v.after||(v.key==='a_highp'?'TD-1’s own steps':cite(v));}
var fam=function(v){return FAM[v.family]||{key:v.family,short:v.family,name:v.family};};
var cap=function(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'");};
function hay(v){var f=fam(v);return norm([v.title,f.short,f.name,citeOf(v),v.note,(v.shows||{}).summary,(v.fn||[]).join(' '),
  v.cards.map(function(id){var c=D.cards[id]||{};return (c.lab||'')+' '+(c.cite||'')+' '+(c.code||'');}).join(' ')].join(' '));}
LIST.forEach(function(v){v._hay=hay(v);});

/* ---------- a card ---------- */
var CHECK='<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>';
function thumb(v){var p=prog(v.key),bar=inProgress(v.key)&&p.d?'<span class="vl-pbar" aria-hidden="true"><i style="width:'+Math.min(100,Math.max(3,Math.round(p.t/p.d*100)))+'%"></i></span>':'';
  return '<span class="vl-thumb"><img src="'+esc(v.poster)+'" alt="" width="640" height="360" decoding="async">'+(watched(v.key)&&!bar?'<span class="vl-seen" aria-hidden="true">'+CHECK+'Watched</span>':'')+bar+
    (v.dur?'<span class="vl-dur" aria-hidden="true">'+mmss(v.dur)+'</span>':'')+'</span>';}
function status(v){var p=prog(v.key),bits=[];
  if(inProgress(v.key))bits.push('Stopped at '+mmss(p.t));else if(watched(v.key))bits.push('<b>Watched</b>');return bits.join(' · ');}
function card(v){var f=fam(v);
  return '<a class="vl-card" href="#video='+encodeURIComponent(v.key)+'" data-key="'+esc(v.key)+'">'+thumb(v)+
    '<span class="vl-info"><span class="vl-av vl-f-'+esc(f.key)+'" aria-hidden="true">'+esc(f.short)+'</span><span class="vl-txt"><span class="vl-t">'+esc(v.title)+'</span>'+
    '<span class="vl-m">'+esc(citeOf(v))+' · '+esc(f.short)+(v.dur?'<span class="vl-sr"> · '+spoken(v.dur)+'</span>':'')+'</span>'+(status(v)?'<span class="vl-st">'+status(v)+'</span>':'')+'</span></span></a>';}

/* ---------- the home page: the chips, the search, Continue watching, a shelf per procedure (or one grid, filtered) ---------- */
var CHIPS=[['all','All']].concat(D.families.map(function(f){return ['fam:'+f[0],f[1]];}),[['-'],['fn:attention','Attention'],['fn:escape','Escape'],['fn:tangible','Tangible'],['fn:automatic','Automatic'],['-'],['seen','Watched'],['unseen','Not watched']]);
var chip='all',q='',view='home',homeY=0,lastKey='';
function pass(v){if(chip.indexOf('fam:')===0&&v.family!==chip.slice(4))return false;if(chip.indexOf('fn:')===0&&(v.fn||[]).indexOf(chip.slice(3))<0)return false;
  if(chip==='seen'&&!watched(v.key))return false;if(chip==='unseen'&&watched(v.key))return false;
  var words=norm(q).split(/\s+/).filter(Boolean);return words.every(function(w){return v._hay.indexOf(w)>=0;});}
function paintChips(){var n=function(id){return LIST.filter(function(v){var c=chip;chip=id;var r=pass(v);chip=c;return r;}).length;};
  $('vlChips').innerHTML=CHIPS.map(function(c){if(c[0]==='-')return '<span class="vl-cdiv" aria-hidden="true"></span>';
    return '<button type="button" class="vl-chip" data-chip="'+c[0]+'" aria-pressed="'+(chip===c[0])+'">'+esc(c[1])+'<span class="vl-n" aria-hidden="true">'+n(c[0])+'</span><span class="vl-sr">, '+n(c[0])+' videos</span></button>';}).join('');}
function chipName(){var c=CHIPS.filter(function(x){return x[0]===chip;})[0];return c?c[1]:'';}
function paintHome(){paintChips();var L=LIST.filter(pass),h='',plain=chip==='all'&&!norm(q).trim();
  $('vlCount').textContent=plain?LIST.length+' videos':L.length+' of '+LIST.length+' videos'+(chip!=='all'?' · '+chipName():'')+(q.trim()?' · “'+q.trim()+'”':'');
  if(plain){var C=LIST.filter(function(v){return inProgress(v.key);}).sort(function(a,b){return prog(b.key).at-prog(a.key).at;});
    if(C.length)h+='<section class="vl-sec" id="vlCont" aria-labelledby="vlContH"><div class="vl-sech"><span class="vl-shd"><h2 id="vlContH">Continue watching</h2><span class="vl-sub">'+C.length+' started on this device</span></span></div><div class="vl-row">'+C.map(card).join('')+'</div></section>';
    D.families.forEach(function(f){var F=LIST.filter(function(v){return v.family===f[0];});if(!F.length)return;
      h+='<section class="vl-sec vl-fam" data-fam="'+f[0]+'" aria-labelledby="vlFam-'+f[0]+'"><div class="vl-sech"><span class="vl-av vl-f-'+f[0]+'" aria-hidden="true">'+esc(f[1])+'</span><span class="vl-shd"><h2 id="vlFam-'+f[0]+'">'+esc(f[2])+'</h2><span class="vl-sub">'+esc(f[1])+' · '+F.length+' video'+(F.length>1?'s':'')+'</span></span>'+
        (F.length>1?'<button type="button" class="vl-btn" data-chip="fam:'+f[0]+'">Only '+esc(f[1])+'</button>':'')+'</div><div class="vl-grid">'+F.map(card).join('')+'</div></section>';});}
  else if(L.length)h='<div class="vl-sec"><div class="vl-grid">'+L.map(card).join('')+'</div></div>';
  else h='<div class="vl-none"><p>No video matches '+(q.trim()?'“'+esc(q.trim())+'”':'')+(chip!=='all'?(q.trim()?' in ':'')+esc(chipName()):'')+'.</p><button type="button" class="vl-btn vl-pri" data-chip="all" data-clear="1">Show all videos</button></div>';
  $('vlList').innerHTML=h;}
$('vlChips').addEventListener('click',function(e){var b=e.target.closest('[data-chip]');if(!b)return;setChip(b.dataset.chip,b);});
$('vlList').addEventListener('click',function(e){var b=e.target.closest('button[data-chip]');if(!b)return;if(b.dataset.clear){q='';$('vlQ').value='';}setChip(b.dataset.chip);});
/* the chip chosen keeps the focus (the row is drawn again); from a shelf's Only button the page goes up to the chips */
function setChip(c,from){var inRow=!!(from&&from.closest&&from.closest('#vlChips'));chip=c;paintHome();var b=document.querySelector('#vlChips [data-chip="'+c+'"]');
  if(b){try{b.focus({preventScroll:inRow});}catch(e){}}if(!inRow){try{$('vlChips').scrollIntoView({block:'nearest'});}catch(e){}}}
var qt=null;$('vlQ').addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(function(){q=$('vlQ').value;paintHome();},120);});
$('vlQ').addEventListener('keydown',function(e){if(e.key==='Enter'){clearTimeout(qt);q=$('vlQ').value;paintHome();}});

/* ---------- a video's page ---------- */
var urls={},token=0,cur=null,saveT=0,openedByTap=false;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=function(){res();};s.onerror=function(){rej(new Error(src));};document.head.appendChild(s);});}
function videoUrl(v){if(urls[v.key])return Promise.resolve(urls[v.key]);
  var have=function(){return window.NBH_TD1_VIDEO&&window.NBH_TD1_VIDEO[v.key];};
  return (have()?Promise.resolve():loadScript(v.file)).then(function(){var b64=have();if(!b64)throw new Error('no video data');
    var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    urls[v.key]=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));try{delete window.NBH_TD1_VIDEO[v.key];}catch(e){}return urls[v.key];});}
function nextOf(v){var fam1=LIST.filter(function(x){return x.family===v.family&&x.key!==v.key;}),seen={};fam1.forEach(function(x){seen[x.key]=1;});
  var fn1=(v.fn||[]).length?LIST.filter(function(x){return x.key!==v.key&&!seen[x.key]&&(x.fn||[]).some(function(f){return v.fn.indexOf(f)>=0;});}):[];
  return {fam:fam1,fn:fn1};}
var OPEN_ICO='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
function nextItem(x){var f=fam(x);return '<li><a class="vl-ni" href="#video='+encodeURIComponent(x.key)+'" data-key="'+esc(x.key)+'">'+thumb(x)+
  '<span class="vl-txt"><span class="vl-t">'+esc(x.title)+'</span><span class="vl-m">'+esc(citeOf(x))+' · '+esc(f.short)+'</span><span class="vl-st">'+status(x)+'</span></span></a></li>';}
function paintWatch(v){var f=fam(v),N=nextOf(v),fnw=(v.fn||[]).map(function(x){return FN[x]||x;});
  var opens=v.cards.map(function(id){var c=D.cards[id]||{};return '<button type="button" class="vl-open" data-card="'+esc(id)+'">'+OPEN_ICO+'<span><b>Open the TD-1 card</b><small>'+esc(c.cite?c.cite+': ':'')+esc(c.lab||id)+'</small></span></button>';}).join('');
  var sum=(v.shows||{}).summary;
  $('vlWatch').innerHTML='<div class="vl-w"><div class="vl-wmain">'+
    '<div class="vl-player"><video id="vlVideo" controls playsinline preload="metadata" poster="'+esc(v.poster)+'" aria-label="'+esc(v.title)+'"></video><p class="vl-load" id="vlLoad" role="status">Loading the video…</p></div>'+
    '<p class="vl-kick"><span class="vl-av vl-f-'+esc(f.key)+'" aria-hidden="true">'+esc(f.short)+'</span>'+esc(f.name)+'</p>'+
    '<h2 class="vl-wt" id="vlTitle" tabindex="-1">'+esc(v.title)+'</h2>'+
    '<p class="vl-wm"><span>'+(v.after?'After '+esc(v.after):esc(citeOf(v)))+'</span>'+(v.dur?'<span aria-hidden="true">·</span><span><span class="vl-sr">Length </span>'+mmss(v.dur)+'</span>':'')+'<span class="vl-ai">AI-generated · simulated people</span></p>'+
    '<div class="vl-resume" id="vlResume" hidden><span id="vlResumeT"></span><button type="button" class="vl-btn" id="vlRestart">Start from the beginning</button></div>'+
    '<div class="vl-panel"><h3>In Form TD-1</h3><div class="vl-opens">'+opens+'</div></div>'+
    '<div class="vl-panel">'+(sum?'<h3>What the video shows</h3><p>'+esc(cap(sum))+'.</p>':'')+
      (fnw.length?'<p class="vl-fns"><b>Function'+(fnw.length>1?'s':'')+' of the behavior in its card'+(v.cards.length>1?'s':'')+':</b> '+fnw.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</p>':'')+
      '<h3 style="margin-top:14px">About this video</h3><p class="vl-note">'+esc(v.note)+' Captions are part of the picture.</p></div>'+
    '</div><aside class="vl-next" aria-labelledby="vlNextH"><h2 id="vlNextH">Up next</h2>'+
      (N.fam.length?'<h3 id="vlNextF">More '+esc(f.short)+'</h3><ol aria-labelledby="vlNextF">'+N.fam.map(nextItem).join('')+'</ol>':'')+
      (N.fn.length?'<h3 id="vlNextN">Also for '+esc(fnw.join(', ').toLowerCase())+'</h3><ol aria-labelledby="vlNextN">'+N.fn.map(nextItem).join('')+'</ol>':'')+
      (!N.fam.length&&!N.fn.length?'<p class="vl-note">No other video of this procedure yet.</p>':'')+
    '</aside></div>';
  var vid=$('vlVideo'),my=++token,ld=$('vlLoad'),tap=openedByTap;
  $('vlRestart').addEventListener('click',function(){try{vid.currentTime=0;}catch(e){}$('vlResume').hidden=true;try{vid.play();}catch(e){}});
  vid.addEventListener('loadedmetadata',function(){var p=prog(v.key);if(p&&inProgress(v.key)&&p.t<vid.duration-2){try{vid.currentTime=p.t;}catch(e){}$('vlResumeT').textContent='Picks up where it stopped on this device, at '+mmss(p.t)+'.';$('vlResume').hidden=false;}});
  var keep=function(force,ended){if(cur!==v.key||!(vid.duration>0))return;var now=Date.now();if(!force&&now-saveT<2000)return;saveT=now;setProg(v.key,vid.currentTime,vid.duration,ended);};
  vid.addEventListener('timeupdate',function(){keep(false);});vid.addEventListener('pause',function(){keep(true);});vid.addEventListener('seeked',function(){keep(true);});
  vid.addEventListener('ended',function(){keep(true,true);});
  vid.addEventListener('play',function(){$('vlResume').hidden=true;});
  videoUrl(v).then(function(u){if(my!==token)return;vid.src=u;ld.hidden=true;if(tap){var pr=vid.play();if(pr&&pr.catch)pr.catch(function(){});}})
    .catch(function(){if(my!==token)return;ld.className='vl-load vl-err';ld.textContent='The video could not be loaded here. It is a file beside the forms ('+v.file+'): open the workstation from its folder or from the website. The one-file edition does not carry it.';});}
$('vlWatch').addEventListener('click',function(e){var b=e.target.closest('[data-card]');if(!b)return;openCard(b.dataset.card);});
function openCard(id){pauseNow();
  if(WS){tell({nbh:'videos-card',card:id});return;}
  location.href=(D.form||'TD-1_Function-Based-Treatment-Developer_v2026-09.html')+'#card='+encodeURIComponent(id);}
function pauseNow(){var vid=$('vlVideo');if(vid&&cur){try{if(vid.duration>0)setProg(cur,vid.currentTime,vid.duration,false);vid.pause();}catch(e){}}}

/* ---------- the two views, from the address: #video=<key> a video's page, else the home page ---------- */
function route(focus){var m=/^#video=([^&]+)/.exec(location.hash||''),k=m?decodeURIComponent(m[1]):'',v=BY[k];
  if(v){if(view==='home')homeY=window.scrollY||0;pauseNow();cur=v.key;lastKey=v.key;view='watch';B.classList.add('vl-watching');$('vlHome').hidden=true;$('vlWatch').hidden=false;$('vlBack').hidden=false;
    paintWatch(v);openedByTap=false;window.scrollTo(0,0);document.title=v.title+' · Video library';if(focus){var t=$('vlTitle');if(t)t.focus({preventScroll:true});}}
  else{var was=view;pauseNow();cur=null;token++;view='home';B.classList.remove('vl-watching');$('vlWatch').hidden=true;$('vlWatch').innerHTML='';$('vlHome').hidden=false;$('vlBack').hidden=true;
    document.title='Video library · FBA and BIP Workstation';paintHome();if(was==='watch'){window.scrollTo(0,homeY);if(focus&&lastKey){var c=document.querySelector('#vlList .vl-card[data-key="'+lastKey+'"]');if(c)c.focus({preventScroll:true});}}}}
/* a video opened from the home page sits one step after it in the history (Back, and All videos, go back to it); a video
   opened from Up next takes the place of the one before, so All videos is always one step */
var fromHome=false;
document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#video="]');if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;openedByTap=true;
  if(view==='watch'){e.preventDefault();location.replace(a.getAttribute('href'));}else fromHome=true;});
addEventListener('hashchange',function(){route(true);});
function home(){if(view!=='watch')return;if(fromHome){fromHome=false;history.back();return;}location.hash='';}
$('vlBack').addEventListener('click',home);
$('vlClose').hidden=!WS;$('vlClose').addEventListener('click',function(){pauseNow();tell({nbh:'videos-close'});});
document.addEventListener('keydown',function(e){if(e.key!=='Escape'||e.defaultPrevented)return;if(document.fullscreenElement||document.webkitFullscreenElement)return;
  if(e.target&&e.target.id==='vlQ'&&e.target.value)return;
  if(view==='watch'){e.preventDefault();home();}else if(WS){e.preventDefault();pauseNow();tell({nbh:'videos-close'});}});
/* the workstation: its text size, contrast and low light; a pause when it puts the library away; the focus when it shows it */
function applyView(v){v=v||{};R.classList.toggle('nbh-tx-1',v.t===1);R.classList.toggle('nbh-tx-2',v.t===2);R.classList.toggle('nbh-hc',!!v.hc);R.classList.toggle('nbh-dark',!!v.dark);}
function viewFromStore(){try{applyView(JSON.parse(localStorage.getItem('nbh.view')||'{}'));}catch(e){}}
addEventListener('message',function(e){var d=e.data;if(!d||e.source!==window.parent||window.parent===window)return;
  if(d.nbh==='view')applyView(d.v);else if(d.nbh==='videos-pause')pauseNow();
  else if(d.nbh==='videos-focus'){var t=view==='watch'?$('vlTitle'):document.querySelector('#vlChips [aria-pressed=true]');if(view==='home'){var c=lastKey&&document.querySelector('#vlList .vl-card[data-key="'+lastKey+'"]');if(c)t=c;}if(t)try{t.focus({preventScroll:view!=='home'||!!lastKey});}catch(x){}}});
addEventListener('pagehide',pauseNow);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){var vid=$('vlVideo');if(vid&&cur&&vid.duration>0)setProg(cur,vid.currentTime,vid.duration,false);}});
var head=$('vlHead');addEventListener('scroll',function(){head.classList.toggle('vl-stuck',(window.scrollY||0)>4);},{passive:true});
window.__vl={view:function(){return view;},key:function(){return cur;},chip:function(){return chip;},store:function(){return JSON.parse(JSON.stringify(store));},framed:function(){return WS;}};
route(false);
})();
</script>
