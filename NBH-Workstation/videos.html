<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video library · FBA and BIP Workstation</title>
<!-- v25.69 (the BCBA, 11/8: "a video layout dashboard like YouTube ... that can show all the video protocols that I have in
     the bank") the video library: every procedure video of Form TD-1's protocol bank, to browse and to watch. The list is
     nbh-videos.js (the one Form TD-1 reads); each video is a file beside the forms, loaded only when it is watched, and its
     picture a small JPG beside it, so the installed app plays them without the internet. Opened from the workstation's
     Videos (over the workstation, in a frame) or on its own; videos.html#video=<key> opens a video's page, and (v25.70, a form's
     Watch how) videos.html#family=<procedure> the home page at that procedure's videos. What was watched
     on this device, and where each video stopped, is kept in this browser (localStorage nbh.videos.v1): the video's key,
     the second and the time, nothing about a student.
     v25.72 (the video library's design review, V1 to V7 and V9 to V11): four columns on an iPad and list rows on a phone;
     Procedure and Function filters that combine, with Watched; on a video's page its Steps (nbh-video-steps.js: each
     step's start and title and the captions, word for word as the video shows them) and Open the TD-1 card first; a
     message over the picture when a video cannot be loaded; at most two videos kept decoded; the load's progress from
     the website; a search that forgives spelling; the keys of a player; the poster and Play under reduced motion.
     v25.72 (captions and transcript, the BCBA's choice of the plan's Option 1): the Steps list every step the picture's
     panel shows (a step only on a card says so), and a Transcript tab beside them (nbh-video-transcripts.js, drawn by
     nbh-transcript.js: the narration, the people's lines by role, the on-screen notes the narration does not say; the line
     heard marked and kept in view, a line tapped plays from it, a search); captions of what is said as a real text track,
     off until CC is turned on (kept in localStorage nbh.videos.pref with the tab last chosen: no student, nothing typed);
     on an iPad the browser's control bar in a band below the picture, clear of its caption strip; on a phone the picture
     cropped to its scene, with the page's own bar, and the Steps and Transcript right under it. -->
<script>
/* the workstation's text size, contrast and low light (localStorage nbh.view, as the forms read it), before the page draws */
(function(){var R=document.documentElement;try{if(window.parent!==window)R.classList.add('nbh-framed');}catch(e){}
 try{var v=JSON.parse(localStorage.getItem('nbh.view')||'{}')||{};R.classList.toggle('nbh-tx-1',v.t===1);R.classList.toggle('nbh-tx-2',v.t===2);R.classList.toggle('nbh-hc',!!v.hc);R.classList.toggle('nbh-dark',!!v.dark);}catch(e){}})();
</script>
<style>
:root{--ink:#1F2D36;--navy:#1D3A52;--wash:#F2F6F5;--paper:#fff;--rule:#D9E2E0;--box:#B9C7C4;--muted:#55656C;--chip:#E5EDEB;--chip-h:#D8E4E1;
  --focus:#2f7fa8;--prog:#2f7fa8;--ai-ink:#7a4f00;--ai-bg:#fff4dc;--ai-rule:#e7c27a;--on:#e8f1f6;
  --sans:"Inter","Helvetica Neue","Segoe UI",Arial,system-ui,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --gut:24px;--r:12px;font-size:16px}
html.nbh-tx-1{font-size:18px}html.nbh-tx-2{font-size:20px}
html.nbh-hc{--ink:#000;--muted:#263238;--rule:#5e7673;--box:#3f5654;--focus:#0a4f75;--chip:#dbe5e3}
/* low light: on its own the page turns dark; in the workstation the workstation turns it (its whole window), and only the
   pictures are turned back here */
@media screen{html.nbh-dark:not(.nbh-framed){filter:invert(1) hue-rotate(180deg);background:#fff}
  html.nbh-dark img,html.nbh-dark video{filter:invert(1) hue-rotate(180deg)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wash);color:var(--ink);font:400 1rem/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vl-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.vl-skip{position:absolute;left:8px;top:-60px;z-index:50;display:inline-flex;align-items:center;min-height:44px;background:var(--navy);color:#fff;padding:0 14px;border-radius:8px;font-weight:600;text-decoration:none}
.vl-skip:focus{top:8px}
.vl-wrap{max-width:1680px;margin:0 auto;padding:0 var(--gut)}
.vl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--box);border-radius:10px;
  background:var(--paper);color:var(--navy);font-weight:600;font-size:.9375rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.vl-btn:hover{background:#eef3f5;border-color:#93aead}
.vl-btn svg{width:18px;height:18px;flex:0 0 auto}
.vl-btn.vl-pri{background:var(--navy);border-color:var(--navy);color:#fff}
.vl-btn.vl-pri:hover{background:#254657}
.vl-ai{display:inline-block;font-size:.8125rem;font-weight:700;color:var(--ai-ink);background:var(--ai-bg);border:1px solid var(--ai-rule);border-radius:999px;padding:2px 10px;white-space:nowrap;line-height:1.5}

/* ---------- the top: the title, the search, Close (in the workstation) ---------- */
.vl-head{position:sticky;top:0;z-index:20;background:rgba(242,246,245,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.vl-head.vl-stuck{border-bottom-color:var(--rule)}
.vl-hrow{display:flex;align-items:center;gap:10px 16px;min-height:68px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.vl-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.vl-mark{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.vl-mark svg{width:22px;height:22px}
.vl-head h1{margin:0;font:600 1.625rem/1.15 var(--serif);color:var(--navy);white-space:nowrap}
.vl-search{flex:1 1 320px;max-width:560px;margin-left:auto;position:relative}
.vl-search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.vl-search input{width:100%;min-height:48px;font-size:16px;padding:0 14px 0 42px;border:1px solid var(--box);border-radius:999px;background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
.vl-search input::placeholder{color:#6b7b82}
.vl-search input:focus{outline:3px solid #9DBAD3;outline-offset:0;border-color:var(--navy)}
#vlClose[hidden],#vlBack[hidden],.vl-search[hidden]{display:none}
body.vl-watching .vl-search{display:none}
body.vl-watching #vlClose{margin-left:auto}

/* ---------- the filters: Procedure and Function (they combine), Watched, the count ---------- */
.vl-intro{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 6px;color:var(--muted);font-size:.9375rem}
.vl-filt{display:grid;gap:8px;padding:2px 0 0}
.vl-frow{display:flex;align-items:center;gap:12px;min-width:0}
.vl-fl{flex:0 0 5.25rem;font-weight:600;font-size:.8125rem;color:var(--muted)}
.vl-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;flex:0 1 auto}
.vl-chip{position:relative;min-height:44px;min-width:44px;padding:0 13px;border-radius:12px;border:1px solid transparent;background:var(--chip);color:var(--ink);font-weight:500;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.vl-chip:hover{background:var(--chip-h)}
.vl-chip[aria-checked=true]{background:var(--navy);color:#fff;font-weight:600}
.vl-chip .vl-n{font-size:.8125rem;opacity:.8;margin-left:6px;font-weight:500}
.vl-chip .vl-n:empty{display:none}
.vl-menus{display:none}
.vl-sel{position:relative;display:flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--box);border-radius:10px;background:var(--paper);color:var(--navy);min-width:0}
.vl-sel>span{font-weight:500;font-size:.9375rem;color:var(--muted);white-space:nowrap;padding-left:14px}
.vl-sel select{-webkit-appearance:none;appearance:none;border:0;background:transparent;min-height:42px;padding:0 34px 0 0;font-weight:600;font-size:.9375rem;color:var(--navy);cursor:pointer;min-width:0;width:100%;border-radius:10px}
.vl-sel select:focus{outline:none}
.vl-sel:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.vl-sel svg{position:absolute;right:9px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.vl-sel-seen{margin-left:auto;flex:0 0 auto}
.vl-sel-seen select{width:auto}
.vl-count{margin:0 0 0 auto;padding-left:8px;color:var(--muted);font-size:.9375rem;white-space:nowrap;min-height:1.45em;flex:0 0 auto}
@media (max-width:1099px){.vl-fl{flex-basis:4.6rem}.vl-frow{gap:8px}.vl-chip{padding:0 10px}.vl-chip .vl-n{margin-left:4px}.vl-chips{gap:6px}}

/* ---------- a shelf (Continue watching, one per procedure) and the grid: four columns on an iPad, either way up ---------- */
.vl-sec{margin:22px 0 4px}
.vl-sech{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.vl-shd{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-width:0;flex:1 1 auto}
.vl-sech h2{margin:0;font:600 1.375rem/1.2 var(--serif);color:var(--navy)}
.vl-sech .vl-sub{color:var(--muted);font-size:.9375rem}
.vl-sech .vl-btn{margin-left:auto;min-height:44px;font-size:.875rem;padding:0 14px;flex:0 0 auto}
.vl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 16px}
.vl-row{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 64px)/4.4);gap:16px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:-2px}
.vl-row>*{scroll-snap-align:start}
@media (max-width:1099px){.vl-grid{gap:20px 12px}.vl-row{grid-auto-columns:calc((100% - 36px)/3.3);gap:12px}}

/* ---------- a video's card ---------- */
.vl-card{display:block;color:inherit;text-decoration:none;border-radius:var(--r);min-width:0;-webkit-tap-highlight-color:transparent}
.vl-card:focus-visible{outline-offset:4px}
.vl-thumb{display:block;position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#cfd9d7;box-shadow:0 1px 2px rgba(16,36,48,.08)}
.vl-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
@media (hover:hover){.vl-card:hover .vl-thumb img{transform:scale(1.03)}}
.vl-dur{position:absolute;right:8px;bottom:8px;background:rgba(14,24,32,.84);color:#fff;font:600 .8125rem/1 var(--sans);padding:4px 6px;border-radius:6px;letter-spacing:.01em}
.vl-pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.55)}
.vl-pbar i{display:block;height:100%;background:var(--prog)}
.vl-pbar~.vl-dur{bottom:12px}
.vl-seen{position:absolute;left:8px;top:8px;background:rgba(14,24,32,.84);color:#fff;font-weight:600;font-size:max(12px,.75rem);line-height:1;font-family:var(--sans);padding:5px 8px 5px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.vl-seen svg{width:13px;height:13px}
.vl-info{display:flex;gap:12px;padding:10px 2px 0;align-items:flex-start}
.vl-av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .6875rem/1 var(--sans);letter-spacing:.02em;background:var(--navy)}
.vl-f-dro{background:#1D3A52}.vl-f-dra{background:#7a3b52}.vl-f-ncr{background:#2f6b37}.vl-f-rird{background:#6b4a7a}.vl-f-highp{background:#9b4e15}.vl-f-fct{background:#22657a}
.vl-txt{position:relative;min-width:0;display:flex;flex-direction:column;gap:3px}
/* a title wraps and is never cut */
.vl-t{font-weight:600;font-size:1rem;line-height:1.3;color:var(--ink);overflow-wrap:break-word}
.vl-m{color:var(--muted);font-size:.875rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vl-st{color:var(--muted);font-size:.8125rem}
.vl-st b{color:#2f6b37;font-weight:600}
.vl-none{margin:28px 0;padding:24px;border-radius:var(--r);background:var(--paper);border:1px solid var(--rule);text-align:center}
.vl-none p{margin:0 0 12px}
.vl-try{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 16px}
.vl-try .vl-btn{font-weight:500}
.vl-tryh{color:var(--muted);font-size:.9375rem}

/* a phone: list rows, the picture at the left; three menus side by side, the count under them */
@media (max-width:699px){:root{--gut:16px}
  .vl-head h1{font-size:1.375rem}.vl-hrow{min-height:60px}.vl-search{flex-basis:100%;max-width:none;order:3}
  .vl-mark{width:34px;height:34px;border-radius:10px}#vlClose{margin-left:auto}
  body.vl-watching .vl-brand{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .vl-intro{font-size:.875rem;margin:0 0 8px}
  .vl-filt{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"a b c" "n n n";gap:8px}
  .vl-frow,.vl-menus{display:contents}.vl-fl,.vl-chips{display:none}
  .vl-sel-fam{grid-area:a}.vl-sel-fn{grid-area:b}.vl-sel-seen{grid-area:c;margin:0}.vl-sel-seen select{width:100%}
  .vl-sel{flex-direction:column;align-items:stretch;gap:0;min-height:52px;padding:0}
  .vl-sel>span{font-size:.6875rem;font-weight:600;line-height:1.25;padding:6px 28px 0 11px}
  .vl-sel select{min-height:26px;padding:0 28px 6px 11px;text-overflow:ellipsis}
  .vl-sel svg{right:6px}
  .vl-count{grid-area:n;justify-self:start;font-size:.875rem;margin:2px 0 0;padding:0}
  .vl-sec{margin:18px 0 4px}
  .vl-sech h2{font-size:1.1875rem}.vl-shd{flex-direction:column;gap:2px}.vl-sech .vl-btn{display:none}
  .vl-grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .vl-row{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible;gap:14px;scroll-snap-type:none;padding:0;margin:0}
  .vl-card{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px;align-items:start}
  .vl-card .vl-thumb{border-radius:8px}
  .vl-card .vl-info{padding:0;gap:0}
  .vl-card .vl-av{display:none}
  .vl-t{font-size:.9375rem}
  .vl-m{font-size:.8125rem;margin-top:2px}
  .vl-st{font-size:.75rem}
  .vl-card .vl-dur{right:4px;bottom:5px;font-size:.75rem;padding:3px 5px}
  .vl-card .vl-pbar~.vl-dur{bottom:9px}
  .vl-card .vl-seen{left:4px;top:4px;padding:4px 6px 4px 5px}}
@media (max-width:359px){.vl-card{grid-template-columns:116px minmax(0,1fr)}}

/* ---------- a video's page ---------- */
.vl-w{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-top:8px;padding-bottom:40px;align-items:start}
@media (max-width:1179px){.vl-w{grid-template-columns:minmax(0,1fr)}}
.vl-player{position:relative;border-radius:var(--r);overflow:hidden;background:#0f1a22;aspect-ratio:16/9}
.vl-player video{display:block;width:100%;height:100%;background:#0f1a22}
.vl-load{position:absolute;left:0;right:0;bottom:0;padding:30px 18px 14px;background:linear-gradient(to top,rgba(10,18,24,.86),rgba(10,18,24,0));color:#fff;font:600 1rem/1.3 var(--sans);pointer-events:none}
.vl-load[hidden]{display:none}
.vl-load .vl-lmb{font-weight:500;opacity:.9;margin-left:8px;font-size:.9375rem}
.vl-lbar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.vl-lbar[hidden]{display:none}
.vl-lbar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.vl-fail,.vl-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 20px;text-align:center}
.vl-fail{background:rgba(10,18,24,.8);color:#fff;font:500 1rem/1.4 var(--sans)}
.vl-fail p{margin:0;max-width:34em}
.vl-fail .vl-btn{background:#fff;color:var(--navy);border-color:#fff}
.vl-fail[hidden],.vl-play[hidden]{display:none}
.vl-play{background:rgba(10,18,24,.25)}
.vl-play .vl-btn{min-height:56px;padding:0 24px;font-size:1.0625rem;background:#fff;color:var(--navy);border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.vl-play .vl-btn svg{width:22px;height:22px}
.vl-kick{display:flex;align-items:center;gap:10px;margin:16px 0 6px;color:var(--muted);font-size:.9375rem}
.vl-kick .vl-av{width:32px;height:32px;font-size:.625rem}
.vl-w h2.vl-wt{margin:0;font:600 1.625rem/1.25 var(--serif);color:var(--navy)}
.vl-w h2.vl-wt:focus{outline:none}
.vl-w h2.vl-wt:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
.vl-wm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0 0;color:var(--muted);font-size:.9375rem}
.vl-resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 0;padding:6px 6px 6px 14px;background:var(--on);border-radius:10px;font-size:.9375rem}
.vl-resume[hidden]{display:none}
.vl-resume .vl-btn{min-height:44px;margin-left:auto}
/* Open the TD-1 card: the main button, with the card's name beside it */
.vl-act{display:grid;gap:10px;margin:14px 0 0}
.vl-actr{display:flex;align-items:center;gap:8px 14px}
.vl-actr .vl-btn{flex:0 0 auto;min-height:48px}
.vl-actr .vl-btn svg{width:20px;height:20px}
.vl-actl{font-size:.9375rem;line-height:1.35;color:var(--muted);min-width:0}
.vl-actl b{display:block;color:var(--ink);font-weight:600}
@media (max-width:699px){.vl-actr{flex-direction:column;align-items:stretch}.vl-actr .vl-btn{justify-content:center}.vl-actl{font-size:.875rem}}
.vl-panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin:18px 0 0}
.vl-panel h3{margin:0 0 10px;font:600 1.0625rem/1.3 var(--sans);color:var(--ink)}
.vl-panel p{margin:0 0 10px;max-width:80ch}
.vl-panel p:last-child{margin-bottom:0}
.vl-fns{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.vl-fns{align-items:center}.vl-fns b{font-weight:600;font-size:.875rem;color:var(--muted);margin-right:2px}
.vl-fns span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8125rem}
.vl-note{color:var(--muted);font-size:.9375rem}
/* the Steps: beside the video on an iPad sideways, under it otherwise */
.vl-steps{padding:12px 8px 8px}
.vl-stepsh{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin:0 10px 6px}
.vl-stepsh h3{margin:0;font:600 1.0625rem/1.3 var(--sans);color:var(--ink);text-transform:none;letter-spacing:0}

.vl-steps ol{list-style:none;margin:0;padding:0;display:block}

.vl-sbtn:hover{background:rgba(29,58,82,.06)}
.vl-stm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.875rem}
.vl-sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--box);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);background:var(--paper)}
.vl-sn.vl-sn0{border-color:transparent;background:none}

.vl-steps li.vl-on .vl-sbtn{font-weight:700;color:var(--navy)}

.vl-scap[hidden]{display:none}
.vl-next .vl-steps{margin:0 0 22px}

.vl-tabs{padding:6px 8px 8px}
.vl-next .vl-tabs{margin:0 0 22px}
.vl-tabl{display:flex;align-items:flex-end;gap:2px;margin:0 2px 8px;border-bottom:1px solid var(--rule)}
.vl-tab{min-height:44px;min-width:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;font:600 1rem/1.2 var(--sans);color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0}
.vl-tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.vl-tab:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.vl-cc{margin:0 0 4px auto;min-height:44px;padding:0 12px;font-size:.9375rem;font-weight:700;gap:6px}
.vl-cc svg{width:20px;height:20px}
.vl-cc[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.vl-tabs .vl-steps{padding:0}
.vl-tabs .vl-stepsh{margin:2px 10px 4px}
.vl-tabs .vl-stepsh h3{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.vl-steps[hidden],.vl-trans[hidden]{display:none}
.vl-snote{display:block;font-size:.8125rem;font-weight:500;color:var(--muted);margin-top:1px}
.vl-steps li[data-where] .vl-sn{border-style:dashed}
.vl-trans{padding:0 4px}
.vl-trans .nt{--nt-h:min(60vh,560px)}
.vl-next .vl-trans .nt{--nt-h:max(280px,calc(100vh - 330px))}
/* the picture: on an iPad the browser's control bar in a band below the picture, clear of its caption strip */
.vl-player.vl-band{aspect-ratio:auto;height:0;padding-top:calc(56.25% + 92px)}
.vl-player.vl-band video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;object-position:50% 0}
/* on a phone: the picture cropped to its scene (896 x 504 of the 1280 x 720 frame, from 64 px down), cards shown whole */
.vl-player.vl-crop video{position:absolute;left:0;top:-12.698%;width:142.857%;height:142.857%;max-width:none;object-fit:fill}
.vl-player.vl-crop.vl-full video{top:0;width:100%;height:100%;object-fit:contain}
.vl-player video::cue{font-family:var(--sans);line-height:1.35;background:rgba(15,26,34,.86);color:#fff}
.vl-bar{display:flex;align-items:center;gap:2px;padding:2px 6px;background:#0f1a22;color:#fff;margin:0 calc(-1*var(--gut))}
.vl-bar[hidden]{display:none}
.vl-bb{width:44px;height:44px;min-width:44px;border:0;border-radius:8px;background:none;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;flex:0 0 auto}
.vl-bb svg{width:24px;height:24px}
.vl-bb .vl-pz,.vl-bb.vl-on svg:first-child{display:none}.vl-bb.vl-on .vl-pz{display:block}
.vl-bb[aria-pressed=true]{background:rgba(255,255,255,.2)}
.vl-bb:focus-visible,.vl-bseek:focus-visible{outline:3px solid #8fd0f0;outline-offset:-3px}
.vl-btime{font:500 .8125rem var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;margin:0 6px}
.vl-bseek{flex:1 1 auto;min-width:60px;height:44px;margin:0 4px;accent-color:#fff;background:none;cursor:pointer}
@media (max-width:699px){#vlStepsTop .vl-tabs{margin:12px 0 0}#vlStepsTop .vl-cc{display:none}}
/* Up next */
.vl-next h2{margin:0 0 12px;font:600 1.25rem/1.2 var(--serif);color:var(--navy)}
.vl-next h3.vl-nh{margin:16px 0 8px;font:700 .75rem/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vl-next h3.vl-nh:first-of-type{margin-top:0}
.vl-next ol.vl-nl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vl-ni{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;align-items:start;color:inherit;text-decoration:none;border-radius:10px;padding:4px;margin:-4px;min-height:44px}
.vl-ni:hover{background:rgba(29,58,82,.06)}
.vl-ni .vl-thumb{border-radius:8px}
.vl-ni .vl-dur{right:5px;bottom:5px;font-size:.75rem;padding:3px 5px}
.vl-ni .vl-t{font-size:.9375rem}
.vl-ni .vl-m{font-size:.8125rem;-webkit-line-clamp:1}
@media (max-width:1179px){.vl-next ol.vl-nl{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}.vl-ni{grid-template-columns:minmax(120px,40%) minmax(0,1fr)}}
@media (max-width:699px){.vl-next ol.vl-nl{grid-template-columns:minmax(0,1fr)}.vl-w h2.vl-wt{font-size:1.375rem}.vl-player{border-radius:0;margin:0 calc(-1*var(--gut))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.vl-card:hover .vl-thumb img{transform:none}}
@media print{.vl-head,.vl-filt,.vl-next{display:none}}

<body>
<a class="vl-skip" href="#vlMain">Skip to the videos</a>
<header class="vl-head" id="vlHead">
  <div class="vl-wrap vl-hrow">
    <button type="button" class="vl-btn" id="vlBack" hidden><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg><span>All videos</span></button>
    <div class="vl-brand"><span class="vl-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg></span><h1>Video library</h1></div>
    <div class="vl-search" role="search"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
      <label class="vl-sr" for="vlQ">Search the videos</label><input id="vlQ" type="search" placeholder="Search: a procedure, a study, a step" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <button type="button" class="vl-btn" id="vlClose" hidden aria-label="Close the video library">Close</button>
  </div>
</header>
<main id="vlMain" tabindex="-1">
  <section id="vlHome" class="vl-wrap" aria-label="All videos">
    <p class="vl-intro"><span class="vl-ai">AI-generated · simulated people</span><span>Each video shows a procedure, not a real session. Adapt every step to the student’s plan.</span></p>
    <div class="vl-filt" id="vlFilt">
      <div class="vl-menus">
        <label class="vl-sel vl-sel-fam"><span>Procedure</span><select id="vlSelFam"></select><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></label>
        <label class="vl-sel vl-sel-fn"><span>Function</span><select id="vlSelFn"></select><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></label>
      </div>
      <div class="vl-frow" data-row="fam"><span class="vl-fl" id="vlFamL">Procedure</span><div class="vl-chips" id="vlChips" role="radiogroup" aria-labelledby="vlFamL"></div><p class="vl-count" id="vlCount" role="status"></p></div>
      <div class="vl-frow" data-row="fn"><span class="vl-fl" id="vlFnL">Function</span><div class="vl-chips" id="vlFns" role="radiogroup" aria-labelledby="vlFnL"></div>
        <label class="vl-sel vl-sel-seen"><span>Watched</span><select id="vlSeen"><option value="all">All</option><option value="seen">Watched</option><option value="unseen">Not watched</option></select><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></label></div>
    </div>
    <div id="vlList"></div>
  </section>
  <section id="vlWatch" class="vl-wrap" hidden aria-labelledby="vlTitle"></section>
</main>
<script>
(function(){
'use strict';
var D=window.NBH_VIDEOS,R=document.documentElement,B=document.body,STEPS={};
/* nbh-video-steps.js: steps [number, start, title], caps [start, caption, step number] */
(function(){var S=window.NBH_VIDEO_STEPS||{};Object.keys(S).forEach(function(k){var x=S[k];if(!x||!x.steps||!x.caps)return;
  STEPS[k]={steps:x.steps.map(function(s){return {n:s[0],t:s[1],title:s[2],where:s[3]||'',with:s[4]};}),caps:x.caps};});})();
/* nbh-video-transcripts.js: [start, who, text] per line ('N' the narrator, 'O' on screen, else the role of the person) */
var TRANS=window.NBH_VIDEO_TRANSCRIPTS||{};
/* the viewer's choices on this device (localStorage nbh.videos.pref): captions on or off, the Steps or Transcript tab */
var PREF='nbh.videos.pref';function pref(){try{var o=JSON.parse(localStorage.getItem(PREF)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}}
function setPref(k,val){var o=pref();o[k]=val;try{localStorage.setItem(PREF,JSON.stringify(o));}catch(e){}}
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
if(!D||!D.list||!D.list.length){$('vlList').innerHTML='<div class="vl-none"><p>The list of videos (nbh-videos.js) could not be loaded. Open the workstation from its folder or from the website.</p></div>';return;}
var LIST=D.list,BY={},FAM={},FN={attention:'Attention',escape:'Escape',tangible:'Tangible',automatic:'Automatic'},FNS=['attention','escape','tangible','automatic'];
LIST.forEach(function(v){BY[v.key]=v;});D.families.forEach(function(f){FAM[f[0]]={key:f[0],short:f[1],name:f[2]};});
/* the workstation around this page (its Videos): Close, and a card opened in its Form TD-1 */
var WS=false;try{WS=window.parent!==window&&!!window.parent.__wsVideos;}catch(e){WS=false;}
var tell=function(m){try{window.parent.postMessage(m,'*');}catch(e){}};
var REDUCE=function(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
var WIDE=function(){try{return matchMedia('(min-width: 1180px)').matches;}catch(e){return false;}};
var PHONE=function(){try{return matchMedia('(max-width: 699px)').matches;}catch(e){return false;}};
var isFull=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement);};

/* ---------- what was watched on this device: localStorage nbh.videos.v1, {v:1, items:{key:{t,d,w,at}}} — the second a
   video stopped at (t), its length (d), watched to the end once (w), when (at). No student, nothing typed. ---------- */
var KEY='nbh.videos.v1';
function readStore(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o==='object'&&o.items&&typeof o.items==='object')return o;}catch(e){}return {v:1,items:{}};}
var store=readStore();
function writeStore(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function prog(k){var it=store.items[k];return it&&typeof it==='object'?it:null;}
function setProg(k,t,d,ended){if(!BY[k]||!(d>0))return;var p=prog(k)||{},w=!!p.w||!!ended||t>=d*0.95;
  store.items[k]={t:ended||t>=d-2?0:Math.max(0,Math.floor(t)),d:Math.round(d),w:w,at:Date.now()};writeStore();}
var inProgress=function(k){var p=prog(k);return !!p&&p.t>=5&&(!p.d||p.t<p.d-2);};
var watched=function(k){var p=prog(k);return !!p&&!!p.w;};
addEventListener('storage',function(e){if(e.key===KEY){store=readStore();if(view==='home')paintHome();}else if(e.key==='nbh.view')viewFromStore();});

/* ---------- words ---------- */
var mmss=function(s){s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;};
var spoken=function(s){s=Math.floor(s||0);var m=Math.floor(s/60),x=s%60;return (m?m+' minute'+(m>1?'s':''):'')+(m&&x?' ':'')+(x||!m?x+' second'+(x===1?'':'s'):'');};
function cite(v){if(v.after)return v.after;var c=(D.cards[v.cards[0]]||{}).cite||'';var m=/^(.*), (\d{4}[a-z]?)$/.exec(c.split('; ')[0]||'');return m?m[1]+' ('+m[2]+')':(c||'TD-1’s own steps');}
function citeOf(v){return v.after||(v.key==='a_highp'?'TD-1’s own steps':cite(v));}
var fam=function(v){return FAM[v.family]||{key:v.family,short:v.family,name:v.family};};
var cap=function(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);};

/* ---------- the search, forgiving spelling: a hyphen and a space alike ("non-contingent", "noncontingent"; "high p",
   "high-p"), a few other spellings, a word of five letters or more with one letter wrong, missing or extra ---------- */
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘']/g,'');};
var SPELL={behaviour:'behavior',behaviours:'behaviors',behavioural:'behavioral',favourite:'favorite',favourites:'favorites',colour:'color',colours:'colors',
  centre:'center',programme:'program',organise:'organize',hip:'highp',hiprobability:'highprobability'};
var words=function(s){return norm(s).split(/[^a-z0-9]+/).filter(Boolean);};
function hay(v){var f=fam(v);return [v.title,f.short,f.name,citeOf(v),v.note,(v.shows||{}).summary,(v.fn||[]).join(' '),
  v.cards.map(function(id){var c=D.cards[id]||{};return (c.lab||'')+' '+(c.cite||'')+' '+(c.code||'');}).join(' ')].join(' ');}
LIST.forEach(function(v){var w=words(hay(v));v._cmp=w.join('');var u={};w.forEach(function(x){if(x.length>=4)u[x]=1;});v._tok=Object.keys(u);});
/* one letter wrong, missing or extra */
function near(a,b){var la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;var i=0,j=0,e=0;
  while(i<la&&j<lb){if(a.charAt(i)===b.charAt(j)){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}
  return e+(la-i)+(lb-j)<=1;}
function wordIn(v,w){if(v._cmp.indexOf(w)>=0)return true;
  if(w.length>=4&&/s$/.test(w)&&v._cmp.indexOf(w.slice(0,-1))>=0)return true;
  if(w.length<5)return false;
  return v._tok.some(function(t){return near(w,t)||(t.length>w.length&&(near(w,t.slice(0,w.length))||near(w,t.slice(0,w.length+1))||near(w,t.slice(0,w.length-1))));});}
/* the keys the search finds (all when it is empty) */
function found(q){var w=words(q).map(function(x){return SPELL[x]||x;}),all={};if(!w.length){LIST.forEach(function(v){all[v.key]=1;});return all;}
  var joined=w.join(''),out={},any=false;joined=SPELL[joined]||joined;
  if(w.length>1||/[-‐–—\/]/.test(q))LIST.forEach(function(v){if(v._cmp.indexOf(joined)>=0){out[v.key]=1;any=true;}});
  if(any)return out;
  LIST.forEach(function(v){if(w.every(function(x){return wordIn(v,x);}))out[v.key]=1;});return out;}

/* ---------- a card ---------- */
var CHECK='<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>';
function thumb(v){var p=prog(v.key),bar=inProgress(v.key)&&p.d?'<span class="vl-pbar" aria-hidden="true"><i style="width:'+Math.min(100,Math.max(3,Math.round(p.t/p.d*100)))+'%"></i></span>':'';
  return '<span class="vl-thumb"><img src="'+esc(v.poster)+'" alt="" width="640" height="360" decoding="async">'+(watched(v.key)&&!bar?'<span class="vl-seen" aria-hidden="true">'+CHECK+'Watched</span>':'')+bar+
    (v.dur?'<span class="vl-dur" aria-hidden="true">'+mmss(v.dur)+'</span>':'')+'</span>';}
function status(v){var p=prog(v.key),bits=[];
  if(inProgress(v.key))bits.push('Stopped at '+mmss(p.t));else if(watched(v.key))bits.push('<b>Watched</b>');return bits.join(' · ');}
/* in a procedure's section the section's heading names the procedure: no badge, no " · DRO" */
function card(v,inFam){var f=fam(v);
  return '<a class="vl-card" href="#video='+encodeURIComponent(v.key)+'" data-key="'+esc(v.key)+'">'+thumb(v)+
    '<span class="vl-info">'+(inFam?'':'<span class="vl-av vl-f-'+esc(f.key)+'" aria-hidden="true">'+esc(f.short)+'</span>')+'<span class="vl-txt"><span class="vl-t">'+esc(v.title)+'</span>'+
    '<span class="vl-m">'+esc(citeOf(v))+(inFam?'':' · '+esc(f.short))+(v.dur?'<span class="vl-sr"> · '+spoken(v.dur)+'</span>':'')+'</span>'+(status(v)?'<span class="vl-st">'+status(v)+'</span>':'')+'</span></span></a>';}

/* ---------- the home page: the filters, the search, Continue watching, a shelf per procedure (or one grid, filtered) ---------- */
var flt={fam:'',fn:'',seen:'all'},q='',view='home',homeY=0,lastKey='',hits=found('');
function passWith(v,o){if(!hits[v.key])return false;if(o.fam&&v.family!==o.fam)return false;if(o.fn&&(v.fn||[]).indexOf(o.fn)<0)return false;
  if(o.seen==='seen'&&!watched(v.key))return false;if(o.seen==='unseen'&&watched(v.key))return false;return true;}
var pass=function(v){return passWith(v,flt);};
var count=function(ch){var o={fam:flt.fam,fn:flt.fn,seen:flt.seen};for(var k in ch)o[k]=ch[k];return LIST.filter(function(v){return passWith(v,o);}).length;};
var FAMS=D.families.filter(function(f){return LIST.some(function(v){return v.family===f[0];});});
/* the two rows: one Tab stop each, the arrow keys inside (a radio group) */
function chipHtml(kind,val,label){return '<button type="button" role="radio" class="vl-chip" data-chip="'+kind+':'+(val||'any')+'" aria-checked="false" tabindex="-1">'+esc(label)+'<span class="vl-n" aria-hidden="true"></span><span class="vl-sr"></span></button>';}
$('vlChips').innerHTML=chipHtml('fam','','Any')+FAMS.map(function(f){return chipHtml('fam',f[0],f[1]);}).join('');
$('vlFns').innerHTML=chipHtml('fn','','Any')+FNS.map(function(f){return chipHtml('fn',f,FN[f]);}).join('');
$('vlSelFam').innerHTML='<option value="">Any</option>'+FAMS.map(function(f){return '<option value="'+f[0]+'">'+esc(f[1])+'</option>';}).join('');
$('vlSelFn').innerHTML='<option value="">Any</option>'+FNS.map(function(f){return '<option value="'+f+'">'+FN[f]+'</option>';}).join('');
function paintFilters(){
  [].forEach.call(document.querySelectorAll('#vlFilt .vl-chip'),function(b){var p=b.dataset.chip.split(':'),k=p[0],val=p[1]==='any'?'':p[1],o={};o[k]=val;var n=count(o),on=flt[k]===val;
    b.setAttribute('aria-checked',String(on));b.tabIndex=on?0:-1;b.querySelector('.vl-n').textContent=val?n:'';b.querySelector('.vl-sr').textContent=', '+n+' video'+(n===1?'':'s');});
  [['vlSelFam','fam',FAMS.map(function(f){return [f[0],f[1]];})],['vlSelFn','fn',FNS.map(function(f){return [f,FN[f]];})]].forEach(function(x){var s=$(x[0]);
    [].forEach.call(s.options,function(o){var c={};c[x[1]]=o.value;var lab=o.value?(x[2].filter(function(y){return y[0]===o.value;})[0]||['',''])[1]:'Any';o.textContent=lab+' ('+count(c)+')';});s.value=flt[x[1]];});
  $('vlSeen').value=flt.seen;}
function fltName(){var b=[];if(flt.fam)b.push(fam({family:flt.fam}).short);if(flt.fn)b.push(FN[flt.fn]);if(flt.seen!=='all')b.push(flt.seen==='seen'?'Watched':'Not watched');return b.join(' · ');}
function paintHome(){hits=found(q);paintFilters();var L=LIST.filter(pass),h='',qq=q.trim(),plain=!flt.fam&&!flt.fn&&flt.seen==='all'&&!words(q).length;
  $('vlCount').textContent=plain?LIST.length+' videos':L.length+' of '+LIST.length+' videos'+(fltName()?' · '+fltName():'')+(qq?' · “'+qq+'”':'');
  if(plain){var C=LIST.filter(function(v){return inProgress(v.key);}).sort(function(a,b){return prog(b.key).at-prog(a.key).at;});
    if(C.length){h+='<section class="vl-sec" id="vlCont" aria-labelledby="vlContH"><div class="vl-sech"><span class="vl-shd"><h2 id="vlContH">Continue watching</h2><span class="vl-sub">'+C.length+' started on this device</span></span></div><div class="vl-row">'+C.map(function(v){return card(v,false);}).join('')+'</div></section>';
      preload(C[0]);}
    FAMS.forEach(function(f){var F=LIST.filter(function(v){return v.family===f[0];});
      h+='<section class="vl-sec vl-fam" data-fam="'+f[0]+'" aria-labelledby="vlFam-'+f[0]+'"><div class="vl-sech"><span class="vl-av vl-f-'+f[0]+'" aria-hidden="true">'+esc(f[1])+'</span><span class="vl-shd"><h2 id="vlFam-'+f[0]+'">'+esc(f[2])+'</h2><span class="vl-sub">'+esc(f[1])+' · '+F.length+' video'+(F.length>1?'s':'')+'</span></span>'+
        (F.length>1?'<button type="button" class="vl-btn" data-set="fam:'+f[0]+'">Only '+esc(f[1])+'</button>':'')+'</div><div class="vl-grid">'+F.map(function(v){return card(v,true);}).join('')+'</div></section>';});}
  else if(L.length)h='<div class="vl-sec"><div class="vl-grid">'+L.map(function(v){return card(v,false);}).join('')+'</div></div>';
  else{/* nothing found: the Procedure and Function choices, then all */
